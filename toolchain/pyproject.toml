[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-wire-audit"
version = "11.0.0"
description = "Source-derived Codex wire protocol audit with package-owned release-closure proof"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
  "tomli>=2,<3; python_version < '3.11'",
]
readme = "README_CODEX_WIRE_AUDIT_V18.md"

[project.scripts]
codex-wire-audit-proof-diff = "codex_wire_audit.proof_diff:main"
codex-wire-audit-proof = "codex_wire_audit.proof_gate:main"
codex-wire-audit = "codex_wire_audit.cli:main"
codex-wire-audit-history = "codex_wire_audit.history_cli:main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "_codex_wire_audit_base_v10",
  "_codex_wire_contract_v10",
  "codex_wire_audit_v10",
  "codex_wire_audit_v11",
]

[tool.setuptools.packages.find]
include = ["codex_wire_audit*"]
namespaces = true

[tool.setuptools.package-data]
codex_wire_audit = [
  "schema_templates/*.schema.json",
  "proof_schema_templates/*.json",
  "metadata_history_data/*.json",
  "metadata_history_container_data/*.json",
  "metadata_history_container_data/keys/*.json",
  "metadata_history_container_data/versions/*.json",
  "coverage_profiles.v1.json",
  "coverage_profiles.v2.json",
  "coverage_profiles.v3.json",
  "context_management_container_data/*.json",
  "release_spec.v1.json",
  "release_spec.schema.json",
]
[project.optional-dependencies]
test = ["coverage>=7.6,<8", "packaging>=24,<26", "pytest>=8,<10"]
