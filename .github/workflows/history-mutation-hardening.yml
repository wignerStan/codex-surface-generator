name: history-mutation-hardening

on:
  push:
    branches: [ci/history-mutation-hardening]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/history-mutation-hardening
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Harden reviewed history mutation contract
        run: |
          set -euo pipefail
          cp .github/scripts/harden_history_mutation.py "$RUNNER_TEMP/harden_history_mutation.py"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "harden_history_mutation.py"
          text = path.read_text()

          old_call = '''text = replace_once(
              text,
              '            processor=processor,\\n            tui_session=tui_session,\\n',
              '            processor=processor,\\n            thread_manager=thread_manager,\\n            tui_session=tui_session,\\n',
              "validator thread manager call",
          )'''
          new_call = '''text = replace_once(
              text,
              '        complete &= validate_history_mutation_sources(\\n            diagnostics=diagnostics,\\n            extractor_id=EXTRACTOR_ID,\\n            processor=processor,\\n            tui_session=tui_session,\\n',
              '        complete &= validate_history_mutation_sources(\\n            diagnostics=diagnostics,\\n            extractor_id=EXTRACTOR_ID,\\n            processor=processor,\\n            thread_manager=thread_manager,\\n            tui_session=tui_session,\\n',
              "validator thread manager call",
          )'''
          if text.count(old_call) != 1:
              raise SystemExit(f"expected one ambiguous callsite edit, found {text.count(old_call)}")
          text = text.replace(old_call, new_call, 1)

          old_fixture = 'text = replace_once(text, \'    tui_session = """\\\\n\', thread_manager_fixture + \'    tui_session = """\\\\n\', "test thread manager fixture")'
          q3 = "'" * 3
          new_fixture = f'text = replace_once(text, "    tui_session = {q3}\\\\n", thread_manager_fixture + "    tui_session = {q3}\\\\n", "test thread manager fixture")'
          if text.count(old_fixture) != 1:
              raise SystemExit(f"expected one fixture quoting edit, found {text.count(old_fixture)}")
          path.write_text(text.replace(old_fixture, new_fixture, 1))
          PY
          git checkout -B contract/app-server/feat/history-mutation origin/contract/app-server/feat/history-mutation
          python "$RUNNER_TEMP/harden_history_mutation.py"
          git diff --check
      - name: Validate exact pinned-source contract
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python -m pytest -q tests/test_app_server_rpc_extractor.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          make check-assets
          python tools/check_canonical_contract.py
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/source-capabilities.json"
      - name: Commit hardened topic
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "Jacob"
          git config user.email "240170694+wignerStan@users.noreply.github.com"
          git commit -m "test(app-server): harden fork and revert identity proof"
          git push origin HEAD:refs/heads/contract/app-server/feat/history-mutation
