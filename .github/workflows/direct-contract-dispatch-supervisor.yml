name: direct-contract-dispatch-supervisor

on:
  push:
    branches:
      - review/canonical-contract-20260909
    paths:
      - .github/workflows/direct-contract-dispatch-supervisor.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: direct-contract-dispatch-supervisor
  cancel-in-progress: false

jobs:
  dispatch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      REVIEWED_MAIN: 3162092be72905b1bf1b29a8f0e5a88619493ef0
      REVIEW_BRANCH: review/canonical-contract-20260909
    steps:
      - name: Check out review history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Wait for the proving finalizer to publish
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            git fetch --no-tags origin main
            current="$(git rev-parse origin/main)"
            if test "$current" != "$REVIEWED_MAIN"; then
              test "$(git rev-parse "$current^")" = "$REVIEWED_MAIN"
              published_tree="$(git rev-parse "$current^{tree}")"
              test ! -z "$published_tree"
              echo "PUBLISHED_SHA=$current" >> "$GITHUB_ENV"
              echo "OLD_MAIN_TREE=$(git rev-parse "$REVIEWED_MAIN^{tree}")" >> "$GITHUB_ENV"
              printf '{"commit":"%s","tree":"%s","parent":"%s"}\n' \
                "$current" "$published_tree" "$REVIEWED_MAIN"
              exit 0
            fi
            sleep 15
          done
          echo 'No candidate reached main within the proving window.' >&2
          exit 1

      - name: Dispatch both permanent main proofs explicitly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run canonical-proof.yml --ref main
          gh workflow run config-surface.yml --ref main

      - name: Require successful workflows for the published commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/direct-dispatch-proof"
          python - <<'PY' | tee "$RUNNER_TEMP/direct-dispatch-proof/workflows.json"
          from __future__ import annotations
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['PUBLISHED_SHA']
          token = os.environ['GH_TOKEN']
          required = {'.github/workflows/canonical-proof.yml', '.github/workflows/config-surface.yml'}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'direct-contract-dispatch-supervisor',
          }
          deadline = time.monotonic() + 4500
          selected = {}
          while time.monotonic() < deadline:
              query = urllib.parse.urlencode({'head_sha': sha, 'per_page': 100})
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?{query}', headers=headers
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  runs = json.load(response)['workflow_runs']
              grouped = {}
              for run in runs:
                  if run['path'] not in required:
                      continue
                  grouped.setdefault(run['path'], []).append(run)
              selected = {}
              for path, candidates in grouped.items():
                  candidates.sort(key=lambda run: run['created_at'], reverse=True)
                  selected[path] = {
                      'id': candidates[0]['id'],
                      'status': candidates[0]['status'],
                      'conclusion': candidates[0]['conclusion'],
                      'url': candidates[0]['html_url'],
                  }
              if required <= set(selected) and all(item['status'] == 'completed' for item in selected.values()):
                  bad = {
                      path: item for path, item in selected.items()
                      if item['conclusion'] not in {'success', 'neutral', 'skipped'}
                  }
                  if bad:
                      raise SystemExit('permanent proof failure: ' + json.dumps(bad, sort_keys=True))
                  print(json.dumps({'commit': sha, 'workflows': selected}, indent=2, sort_keys=True))
                  break
              time.sleep(20)
          else:
              raise SystemExit('timed out waiting for explicitly dispatched proofs: ' + json.dumps(selected, sort_keys=True))
          PY

      - name: Record successful landing and retire the review branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body="The direct-only canonical implementation is on \`main\` at \`$PUBLISHED_SHA\`. Both permanent workflows were explicitly dispatched for that exact commit and passed. The clean commit has parent \`$REVIEWED_MAIN\`; no force update was used."
          gh api "repos/$GITHUB_REPOSITORY/issues/4/comments" --method POST --field body="$body"
          gh api "repos/$GITHUB_REPOSITORY/pulls/4" --method PATCH --field state=closed >/dev/null
          git push origin --delete "$REVIEW_BRANCH" || true

      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-contract-dispatch-proof
          path: ${{ runner.temp }}/direct-dispatch-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Forward-revert main if an explicitly dispatched proof fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if test -z "${PUBLISHED_SHA:-}"; then
            exit 0
          fi
          git fetch --no-tags origin main
          if test "$(git rev-parse origin/main)" != "$PUBLISHED_SHA"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          revert_sha="$(printf '%s\n' 'revert: restore main after failed dispatched canonical proof' | git commit-tree "$OLD_MAIN_TREE" -p "$PUBLISHED_SHA")"
          git push origin "$revert_sha:refs/heads/main"

      - name: Remove supervisor staging when no candidate was published
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${PUBLISHED_SHA:-}"; then
            exit 0
          fi
          git reset --hard "$GITHUB_SHA"
          rm -f .github/workflows/direct-contract-dispatch-supervisor.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove unused direct-contract supervisor'
          git fetch --no-tags origin "refs/heads/$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
