name: temporary-canonical-machine-schema-8f27c9

on:
  push:
    branches:
      - codex/canonical-machine-schema-v1-8f27c9

permissions:
  contents: write
  actions: read

concurrency:
  group: temporary-canonical-machine-schema-8f27c9
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out temporary publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Preserve one-use publisher outside the worktree
        run: cp .github/canonical_machine_schema_publisher.py "$RUNNER_TEMP/canonical_machine_schema_publisher.py"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Reset candidate directly onto the current main parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          git checkout -B canonical-machine-schema-candidate "$base_sha"
          printf 'BASE_SHA=%s\n' "$base_sha" >> "$GITHUB_ENV"
          printf '{"base_sha":"%s"}\n' "$base_sha" > "$RUNNER_TEMP/base.json"

      - name: Materialize canonical schema and source layout
        run: python "$RUNNER_TEMP/canonical_machine_schema_publisher.py" | tee "$RUNNER_TEMP/publisher.json"

      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Validate canonical contract and source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canonical-publication-evidence"
          python toolchain/tools/check_canonical_contract.py \
            --output "$RUNNER_TEMP/canonical-publication-evidence/contract-validation.json"
          python toolchain/tools/check_architecture_docs.py \
            | tee "$RUNNER_TEMP/canonical-publication-evidence/architecture-docs.txt"
          make -C toolchain compile \
            | tee "$RUNNER_TEMP/canonical-publication-evidence/compile.txt"
          python -m pytest -q toolchain/tests \
            | tee "$RUNNER_TEMP/canonical-publication-evidence/pytest.txt"
          make -C toolchain check-assets \
            | tee "$RUNNER_TEMP/canonical-publication-evidence/check-assets.txt"
          python toolchain/tools/maintainability_metrics.py --check \
            | tee "$RUNNER_TEMP/canonical-publication-evidence/maintainability.txt"
          (
            cd toolchain
            python -m codex_wire_audit.release_contract \
              --output "$RUNNER_TEMP/canonical-publication-evidence/source-capability-probe.json"
          )

      - name: Validate pinned Codex integration
        shell: bash
        env:
          PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/canonical-publication-evidence/pinned-config-surface"
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output "$RUNNER_TEMP/canonical-publication-evidence/pinned-config-surface/integration.json" \
            --schema-output "$RUNNER_TEMP/canonical-publication-evidence/pinned-config-surface/config-schema.json" \
            --graph-output "$RUNNER_TEMP/canonical-publication-evidence/pinned-config-surface/config-surface-graph.json"

      - name: Create the clean implementation commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          find . -type l -print -quit | grep -q . && {
            echo 'symlink introduced in publication tree' >&2
            exit 1
          } || true
          if git grep -nE 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . \
            ':!*.md' ':!contracts/codex-system-contract/v1/schema.json'; then
            echo 'secret-like material found' >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          git config user.name 'Jacob'
          git config user.email '240170694+wignerStan@users.noreply.github.com'
          git commit -m 'feat: publish canonical machine-readable system contract' \
            -m 'Establish codex-system-contract/v1 as the semantic authority, bind derived compatibility views to canonical digests, validate references and evidence, split the oversized local-storage source without changing namespace semantics, and replace bootstrap recovery with a permanent read-only proof.'
          candidate_sha="$(git rev-parse HEAD)"
          parent_sha="$(git rev-parse HEAD^)"
          test "$parent_sha" = "$BASE_SHA"
          printf 'CANDIDATE_SHA=%s\n' "$candidate_sha" >> "$GITHUB_ENV"
          printf 'candidate_sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          python - "$BASE_SHA" "$candidate_sha" > "$RUNNER_TEMP/canonical-publication-evidence/publication-candidate.json" <<'PY'
          import json
          import sys
          print(json.dumps({"base_sha": sys.argv[1], "candidate_sha": sys.argv[2]}, indent=2, sort_keys=True))
          PY

      - name: Push candidate ref and guarded fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          candidate_ref='refs/heads/codex/canonical-machine-schema-candidate-8f27c9'
          git push origin "HEAD:$candidate_ref"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          test "$current_main" = "$BASE_SHA" || {
            echo "main moved: expected $BASE_SHA, found $current_main" >&2
            exit 1
          }
          test "$(git rev-parse HEAD^)" = "$current_main"
          git push origin HEAD:refs/heads/main
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SHA"
          python - "$BASE_SHA" "$CANDIDATE_SHA" > "$RUNNER_TEMP/canonical-publication-evidence/publication-result.json" <<'PY'
          import json
          import sys
          print(json.dumps({
              "status": "published",
              "strategy": "guarded-fast-forward",
              "force": False,
              "base_sha": sys.argv[1],
              "candidate_sha": sys.argv[2],
              "schema": "codex-system-contract/v1",
          }, indent=2, sort_keys=True))
          PY

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-machine-schema-publication-evidence
          path: ${{ runner.temp }}/canonical-publication-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Remove one-use refs
        if: success()
        shell: bash
        run: |
          git push origin --delete codex/canonical-machine-schema-candidate-8f27c9 || true
          git push origin --delete "$GITHUB_REF_NAME" || true
