name: apply-v19-config-surface

on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap-v19.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v19-config-surface
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Apply hash-bound v19 source changes
        shell: bash
        run: |
          set -euo pipefail

          sha256sum --check .github/v19-config-surface.parts.sha256
          cat .github/v19-config-surface.patch.xz.b64.part-* \
            | base64 --decode > "$RUNNER_TEMP/base.patch.xz"
          xz --test "$RUNNER_TEMP/base.patch.xz"
          xz --decompress --stdout "$RUNNER_TEMP/base.patch.xz" \
            > "$RUNNER_TEMP/base.patch"

          if ! git cat-file -e HEAD:toolchain/README.md 2>/dev/null; then
            printf '%s\n' \
              '# Codex wire audit' \
              '' \
              'The active release line is **v18 / package 11.0.0**.' \
              '' \
              'See [`README_CODEX_WIRE_AUDIT_V18.md`](README_CODEX_WIRE_AUDIT_V18.md) for release, verification, safety, and reproducibility instructions.' \
              > toolchain/README.md
            git add toolchain/README.md
          fi
          git apply --check --index --whitespace=error \
            --exclude=README.md "$RUNNER_TEMP/base.patch"
          git apply --index --whitespace=error \
            --exclude=README.md "$RUNNER_TEMP/base.patch"

          sha256sum --check .github/v19-config-surface-code.patch.xz.parts.sha256
          cat .github/v19-config-surface-code.patch.xz.b64.part-* \
            | base64 --decode > "$RUNNER_TEMP/fix.patch.xz"
          printf '%s  %s\n' \
            8b7921de08f06b16f85719b879ecb0bf9a0fa94768723d2b1afc5d40851ee7aa \
            "$RUNNER_TEMP/fix.patch.xz" | sha256sum --check -
          xz --test "$RUNNER_TEMP/fix.patch.xz"
          xz --decompress --stdout "$RUNNER_TEMP/fix.patch.xz" \
            > "$RUNNER_TEMP/fix.patch"
          printf '%s  %s\n' \
            8125bda041511a48bb545248b16047ae3154784ba7bf77dce1bcb37f3358f4ab \
            "$RUNNER_TEMP/fix.patch" | sha256sum --check -
          git apply --check --index --whitespace=error "$RUNNER_TEMP/fix.patch"
          git apply --index --whitespace=error "$RUNNER_TEMP/fix.patch"

          python - <<'PY'
          from pathlib import Path
          path = Path("toolchain/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = 'test = ["coverage>=7.6,<8", "packaging>=24,<26", "pytest>=8,<10"]'
          new = 'test = ["coverage>=7.6,<8", "packaging>=24,<26", "pytest>=8,<10", "setuptools>=82,<83"]'
          if text.count(old) != 1:
              raise SystemExit("expected one v19 test dependency declaration")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git add toolchain/pyproject.toml

          git rm \
            .github/v19-config-surface.patch.xz \
            .github/v19-config-surface.patch.xz.b64.part-* \
            .github/v19-config-surface.parts.sha256 \
            .github/v19-config-surface-code.patch.b64.part-* \
            .github/v19-config-surface-code.patch.sha256 \
            .github/v19-config-surface-code.patch.xz.b64.part-* \
            .github/v19-config-surface-code.patch.xz.parts.sha256 \
            .github/v19-config-surface-followup.patch

          # The Actions token can publish source but cannot create/update workflow
          # files. Keep the generated workflow in the worktree for evidence, but
          # omit it from this commit; the GitHub connection installs it afterward.
          git rm --cached --ignore-unmatch .github/workflows/config-surface.yml
          git diff --cached --check

      - name: Install constrained dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Regenerate assets and verify package
        working-directory: toolchain
        run: |
          set -euo pipefail
          make legacy-assets metrics
          git add \
            codex_wire_audit_v11_examples \
            codex_wire_audit_v19_maintainability_metrics.json \
            CODEX_WIRE_AUDIT_V19_METRICS.md
          python -m pytest -q
          make check-assets
          python tools/maintainability_metrics.py --check
          mkdir -p ci-out/bootstrap-package
          python -m codex_wire_audit.release_contract \
            --output ci-out/bootstrap-package/source-capability-probe.json
          git diff --cached --check

      - name: Check out pinned Codex source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openai/codex
          ref: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
          path: codex-source
          fetch-depth: 1

      - name: Generate and verify pinned configuration surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain/ci-out/bootstrap-config-surface
          python toolchain/tools/check_config_surface.py \
            --codex-root codex-source \
            --output toolchain/ci-out/bootstrap-config-surface/integration.json \
            --schema-output toolchain/ci-out/bootstrap-config-surface/config-schema.json \
            --graph-output toolchain/ci-out/bootstrap-config-surface/config-surface-graph.json

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-surface-generator[bot]"
          git config user.email "codex-surface-generator[bot]@users.noreply.github.com"
          git commit -m "feat: connect config schema to the canonical surface graph"
          git push origin HEAD:main

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v19-config-surface-bootstrap-evidence
          path: |
            toolchain/ci-out/bootstrap-package
            toolchain/ci-out/bootstrap-config-surface
            .github/workflows/config-surface.yml
          if-no-files-found: warn
          retention-days: 30
