name: apply-v19-config-surface

# One-shot migration from the imported v18 tree to the verified v19 config surface.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v19.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v19-config-surface
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Apply the closed v19 change set and reviewed schema-policy correction
        shell: bash
        run: |
          set -euo pipefail

          sha256sum --check .github/v19-config-surface.parts.sha256
          cat .github/v19-config-surface.patch.xz.b64.part-* \
            | base64 --decode \
            > "$RUNNER_TEMP/v19-config-surface.patch.xz"
          xz --test "$RUNNER_TEMP/v19-config-surface.patch.xz"
          xz --decompress --stdout "$RUNNER_TEMP/v19-config-surface.patch.xz" \
            > "$RUNNER_TEMP/v19-config-surface.patch"

          # Root README advanced after the closed patch was assembled. Preserve
          # the newer Desktop/Code Mode architecture entrypoints; the final v19
          # documentation update is applied after this source migration.
          if ! git cat-file -e HEAD:toolchain/README.md 2>/dev/null; then
            printf '%s\n' \
              '# Codex wire audit' \
              '' \
              'The active release line is **v18 / package 11.0.0**.' \
              '' \
              'See [`README_CODEX_WIRE_AUDIT_V18.md`](README_CODEX_WIRE_AUDIT_V18.md) for release, verification, safety, and reproducibility instructions. Historical v11–v17 documentation is retained for migration and audit lineage.' \
              > toolchain/README.md
            git add toolchain/README.md
          fi
          git apply --check --index --whitespace=error \
            --exclude=README.md \
            "$RUNNER_TEMP/v19-config-surface.patch"
          git apply --index --whitespace=error \
            --exclude=README.md \
            "$RUNNER_TEMP/v19-config-surface.patch"

          sha256sum --check .github/v19-config-surface-code.patch.xz.parts.sha256
          cat .github/v19-config-surface-code.patch.xz.b64.part-* \
            | base64 --decode \
            > "$RUNNER_TEMP/v19-config-surface-code.patch.xz"
          printf '%s  %s\n' \
            8b7921de08f06b16f85719b879ecb0bf9a0fa94768723d2b1afc5d40851ee7aa \
            "$RUNNER_TEMP/v19-config-surface-code.patch.xz" \
            | sha256sum --check -
          xz --test "$RUNNER_TEMP/v19-config-surface-code.patch.xz"
          xz --decompress --stdout "$RUNNER_TEMP/v19-config-surface-code.patch.xz" \
            > "$RUNNER_TEMP/v19-config-surface-code.patch"
          printf '%s  %s\n' \
            8125bda041511a48bb545248b16047ae3154784ba7bf77dce1bcb37f3358f4ab \
            "$RUNNER_TEMP/v19-config-surface-code.patch" \
            | sha256sum --check -
          git apply --check --index --whitespace=error \
            "$RUNNER_TEMP/v19-config-surface-code.patch"
          git apply --index --whitespace=error \
            "$RUNNER_TEMP/v19-config-surface-code.patch"

          python - <<'PYPROJECT_EOF'
          from pathlib import Path

          path = Path("toolchain/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = 'test = ["coverage>=7.6,<8", "packaging>=24,<26", "pytest>=8,<10"]'
          new = 'test = ["coverage>=7.6,<8", "packaging>=24,<26", "pytest>=8,<10", "setuptools>=82,<83"]'
          if text.count(old) != 1:
              raise SystemExit("expected one v19 test dependency declaration")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PYPROJECT_EOF
          git add toolchain/pyproject.toml

          git rm \
            .github/v19-config-surface.patch.xz \
            .github/v19-config-surface.patch.xz.b64.part-* \
            .github/v19-config-surface.parts.sha256 \
            .github/v19-config-surface-code.patch.b64.part-* \
            .github/v19-config-surface-code.patch.sha256 \
            .github/v19-config-surface-code.patch.xz.b64.part-* \
            .github/v19-config-surface-code.patch.xz.parts.sha256 \
            .github/v19-config-surface-followup.patch \
            .github/workflows/debug-v19-patch.yml \
            .github/workflows/bootstrap-v19.yml
          git diff --cached --check

      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Regenerate owned assets and run package proof
        working-directory: toolchain
        run: |
          set -euo pipefail
          make legacy-assets metrics
          git add \
            codex_wire_audit_v11_examples \
            codex_wire_audit_v19_maintainability_metrics.json \
            CODEX_WIRE_AUDIT_V19_METRICS.md
          python -m pytest -q
          make check-assets
          python tools/maintainability_metrics.py --check
          mkdir -p ci-out/bootstrap-package
          python -m codex_wire_audit.release_contract \
            --output ci-out/bootstrap-package/source-capability-probe.json
          git diff --cached --check

      - name: Check out pinned Codex source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openai/codex
          ref: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
          path: codex-source
          fetch-depth: 1

      - name: Generate and verify the pinned configuration surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain/ci-out/bootstrap-config-surface
          python toolchain/tools/check_config_surface.py \
            --codex-root codex-source \
            --output toolchain/ci-out/bootstrap-config-surface/integration.json \
            --schema-output toolchain/ci-out/bootstrap-config-surface/config-schema.json \
            --graph-output toolchain/ci-out/bootstrap-config-surface/config-surface-graph.json

      - name: Commit the verified v19 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-surface-generator[bot]"
          git config user.email "codex-surface-generator[bot]@users.noreply.github.com"
          git status --short
          git commit -m "feat: connect config schema to the canonical surface graph"
          git push origin HEAD:main

      - name: Capture staged implementation on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain/ci-out/bootstrap-source
          git diff --cached --binary --full-index \
            > toolchain/ci-out/bootstrap-source/v19-applied.patch
          git diff --cached --name-status \
            > toolchain/ci-out/bootstrap-source/v19-name-status.txt
          tar --exclude='toolchain/ci-out' \
              --exclude='toolchain/.pytest_cache' \
              --exclude='toolchain/*.egg-info' \
              -czf toolchain/ci-out/bootstrap-source/v19-staged-source.tar.gz \
              toolchain .github/workflows/config-surface.yml

      - name: Upload bootstrap verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v19-config-surface-bootstrap-evidence
          path: |
            toolchain/ci-out/bootstrap-package
            toolchain/ci-out/bootstrap-config-surface
            toolchain/ci-out/bootstrap-source
          if-no-files-found: warn
          retention-days: 30
