name: review-canonical-source

on:
  push:
    branches: [review/canonical-contract-20260909]
    paths:
      - ".github/review-canonical.patch"
      - ".github/review-storage-refactor.py"
      - ".github/workflows/review-canonical-source.yml"

permissions:
  contents: write

concurrency:
  group: review-canonical-source-20260909
  cancel-in-progress: false

jobs:
  validate-and-publish-review-branch:
    if: github.repository == 'wignerStan/codex-surface-generator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify exact reviewed base and patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'review/canonical-contract-20260909'
          test "$(git rev-parse HEAD^)" = '3162092be72905b1bf1b29a8f0e5a88619493ef0'
          test "$(git rev-parse HEAD^:toolchain)" = '0207dc2ff850cd5f2df9514c451a6620712931ae'
          test "$(git hash-object .github/review-canonical.patch)" = '8d46586f03df3e4cef2aea8c6f07b6101ff9d205'
          git apply --check .github/review-canonical.patch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install constrained test dependencies
        run: python -m pip install --constraint toolchain/ci/constraints.txt -e './toolchain[test]'
      - name: Materialize ordinary source and verify storage parity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-proof"
          export PYTHONPATH="$GITHUB_WORKSPACE/toolchain:$GITHUB_WORKSPACE/toolchain/tests"
          python -c 'from test_local_storage_v19 import _extract; from codex_wire_audit.canonical import canonical_json_bytes; import sys; sys.stdout.buffer.write(canonical_json_bytes(_extract()[0].data))' > "$RUNNER_TEMP/review-proof/storage-before.json"
          git apply .github/review-canonical.patch
          python .github/review-storage-refactor.py
          python -c 'from test_local_storage_v19 import _extract; from codex_wire_audit.canonical import canonical_json_bytes; import sys; sys.stdout.buffer.write(canonical_json_bytes(_extract()[0].data))' > "$RUNNER_TEMP/review-proof/storage-after.json"
          cmp "$RUNNER_TEMP/review-proof/storage-before.json" "$RUNNER_TEMP/review-proof/storage-after.json"
          rm .github/review-canonical.patch .github/review-storage-refactor.py
      - name: Generate and stage candidate assets
        working-directory: toolchain
        run: |
          set -euo pipefail
          python tools/build_v11_assets.py
          python tools/check_canonical_contract.py --write-assets
          python tools/maintainability_metrics.py --write
          git add -A
          git diff --cached --check
          echo "TESTED_TREE=$(git write-tree)" >> "$GITHUB_ENV"
      - name: Validate the exact candidate
        working-directory: toolchain
        run: |
          set -euo pipefail
          make compile
          python -m pytest -q | tee "$RUNNER_TEMP/review-proof/tests.txt"
          make check-assets | tee "$RUNNER_TEMP/review-proof/assets.txt"
          python tools/check_canonical_contract.py --output "$RUNNER_TEMP/review-proof/contract-assets.json"
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/review-proof/source-capabilities.json"
      - name: Publish only the tested review branch, without force
        run: |
          set -euo pipefail
          branch='review/canonical-contract-20260909'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add -A
          test "$(git write-tree)" = "$TESTED_TREE"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: materialize and validate source-derived canonical contract'
          git fetch --no-tags origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch"
          git fetch --no-tags origin "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          printf '{"status":"published-review-branch","commit":"%s","tree":"%s","parent":"%s","force":false}\n' "$(git rev-parse HEAD)" "$TESTED_TREE" "$GITHUB_SHA" > "$RUNNER_TEMP/review-proof/publication.json"
          git archive --format=tar HEAD > "$RUNNER_TEMP/review-source.tar"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-review-source-proof
          path: |
            ${{ runner.temp }}/review-proof
            ${{ runner.temp }}/review-source.tar
          if-no-files-found: warn
          retention-days: 14
