name: temporary-canonical-machine-schema

on:
  push:
    branches:
      - codex-bootstrap-canonical-machine-schema-20260909

permissions:
  actions: write
  contents: write

concurrency:
  group: temporary-canonical-machine-schema
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event.head_commit.message == 'chore: stage canonical machine-readable schema'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 437f01742fa88ff346a39bec8eb50779622041be
      BOOTSTRAP_BRANCH: codex-bootstrap-canonical-machine-schema-20260909
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - name: Check out the bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Guard the publication base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD

      - name: Write the canonical contract and repair the proof path
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import copy
          import subprocess
          import sys
          import textwrap
          from pathlib import Path

          ROOT = Path.cwd()

          FILES: dict[str, str] = {
              '.gitignore': r'''
          __pycache__/
          *.py[cod]
          *.egg-info/
          .pytest_cache/
          .mypy_cache/
          .ruff_cache/
          .coverage
          coverage.json
          htmlcov/
          build/
          dist/
          toolchain/build/
          toolchain/dist/
          toolchain/ci-out/
          ''',
              'toolchain/codex_wire_audit/system_contract.py': r'''
          """Canonical, deterministic Codex connected-system contract.

          ``codex-system-contract/v1`` is the sole semantic authority for connected
          configuration, resolution, environment, lifecycle, turn, and local-storage
          evidence. Older reports remain useful as digest-bound compatibility views,
          but they do not compete with this representation as sources of truth.
          """

          from __future__ import annotations

          import copy
          import hashlib
          import json
          import math
          import re
          from collections.abc import Iterable, Mapping, Sequence
          from typing import Any


          SCHEMA_ID = "codex-system-contract/v1"
          SCHEMA_URI = "urn:codex-system-contract:v1"
          DOMAINS = (
              "configuration",
              "resolution",
              "environment",
              "lifecycle",
              "turn",
              "local_storage",
          )
          COLLECTIONS = ("entities", "relations", "rules", "claims", "evidence")
          REFERENCE_LIST_FIELDS = (
              "entity_refs",
              "relation_refs",
              "rule_refs",
              "claim_refs",
              "evidence_refs",
              "subject_refs",
          )
          ID_PATTERN = r"^[a-z][a-z0-9_.:/-]{2,127}$"
          _ID_RE = re.compile(ID_PATTERN)
          _DIGEST_RE = re.compile(r"^[0-9a-f]{64}$")
          _SENSITIVE_KEY_RE = re.compile(
              r"(?:^|[_-])(?:api[_-]?key|access[_-]?token|refresh[_-]?token|"
              r"authorization|cookie|password|passwd|private[_-]?key|"
              r"client[_-]?secret|credential|secret)(?:$|[_-])",
              re.IGNORECASE,
          )
          _SECRET_VALUE_PATTERNS = (
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bsk-[A-Za-z0-9_-]{16,}\b"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bBearer\s+[A-Za-z0-9._~+/-]{20,}\b", re.IGNORECASE),
          )
          _REDACTED = {"", "redacted", "[redacted]", "<redacted>", "***"}


          class ContractValidationError(ValueError):
              """Raised when a contract violates one or more canonical invariants."""

              def __init__(self, errors: Sequence[str]):
                  self.errors = tuple(errors)
                  super().__init__("invalid codex system contract:\n- " + "\n- ".join(errors))


          def canonical_json(value: Any) -> str:
              """Return the RFC-8259-compatible deterministic JSON encoding."""

              return json.dumps(
                  value,
                  ensure_ascii=False,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )


          def canonical_sha256(value: Any) -> str:
              """Hash the deterministic JSON encoding of *value*."""

              return hashlib.sha256(canonical_json(value).encode("utf-8")).hexdigest()


          def _record_id(collection: str, record: Mapping[str, Any]) -> str | None:
              key = "fragment_id" if collection == "fragments" else "id"
              value = record.get(key)
              return value if isinstance(value, str) else None


          def _normalise(document: Mapping[str, Any]) -> dict[str, Any]:
              result = copy.deepcopy(dict(document))
              for collection in (*COLLECTIONS, "fragments"):
                  records = result.get(collection, [])
                  if not isinstance(records, list):
                      continue
                  for record in records:
                      if not isinstance(record, dict):
                          continue
                      for field in REFERENCE_LIST_FIELDS:
                          refs = record.get(field)
                          if isinstance(refs, list) and all(isinstance(item, str) for item in refs):
                              record[field] = sorted(set(refs))
                  records.sort(key=lambda item: _record_id(collection, item) or "")
              views = result.get("compatibility_views", [])
              if isinstance(views, list):
                  views.sort(key=lambda item: item.get("name", "") if isinstance(item, dict) else "")
              coverage = result.get("coverage")
              if isinstance(coverage, dict):
                  required = coverage.get("required_domains")
                  present = coverage.get("present_domains")
                  if isinstance(required, list):
                      coverage["required_domains"] = [domain for domain in DOMAINS if domain in required]
                  if isinstance(present, list):
                      coverage["present_domains"] = [domain for domain in DOMAINS if domain in present]
              return result


          def _digest_projection(document: Mapping[str, Any]) -> dict[str, Any]:
              keys = (
                  "schema",
                  "contract_id",
                  "source_revision",
                  "generator",
                  "coverage",
                  "fragments",
                  "entities",
                  "relations",
                  "rules",
                  "claims",
                  "evidence",
              )
              return {key: copy.deepcopy(document.get(key)) for key in keys}


          def _defined_domains(document: Mapping[str, Any]) -> set[str]:
              domains: set[str] = set()
              for collection in (*COLLECTIONS, "fragments"):
                  records = document.get(collection, [])
                  if not isinstance(records, list):
                      continue
                  for record in records:
                      if isinstance(record, Mapping) and isinstance(record.get("domain"), str):
                          domains.add(record["domain"])
              return domains


          def seal_contract(document: Mapping[str, Any]) -> dict[str, Any]:
              """Normalise, digest-bind, and validate a canonical contract."""

              result = _normalise(document)
              present = _defined_domains(result)
              result["coverage"] = {
                  "required_domains": list(DOMAINS),
                  "present_domains": [domain for domain in DOMAINS if domain in present],
              }
              digest = canonical_sha256(_digest_projection(result))
              result["canonical_sha256"] = digest
              views = result.setdefault("compatibility_views", [])
              if not isinstance(views, list):
                  raise ContractValidationError(("compatibility_views must be an array",))
              for view in views:
                  if not isinstance(view, dict):
                      continue
                  view["source_contract_sha256"] = digest
                  view["representation_sha256"] = canonical_sha256(view.get("representation"))
              result = _normalise(result)
              validate_contract(result)
              return result


          def _add_error(errors: list[str], condition: bool, message: str) -> None:
              if not condition:
                  errors.append(message)


          def _valid_json_value(value: Any, path: str, errors: list[str]) -> None:
              if value is None or isinstance(value, (str, bool, int)):
                  return
              if isinstance(value, float):
                  if not math.isfinite(value):
                      errors.append(f"{path} contains a non-finite number")
                  return
              if isinstance(value, list):
                  for index, child in enumerate(value):
                      _valid_json_value(child, f"{path}[{index}]", errors)
                  return
              if isinstance(value, dict):
                  for key, child in value.items():
                      if not isinstance(key, str):
                          errors.append(f"{path} contains a non-string object key")
                          continue
                      _valid_json_value(child, f"{path}.{key}", errors)
                  return
              errors.append(f"{path} contains non-JSON value {type(value).__name__}")


          def _scan_secrets(value: Any, path: str, errors: list[str]) -> None:
              if isinstance(value, Mapping):
                  for key, child in value.items():
                      child_path = f"{path}.{key}"
                      if _SENSITIVE_KEY_RE.search(str(key)):
                          if isinstance(child, str) and child.strip().lower() not in _REDACTED:
                              errors.append(f"{child_path} is a secret-bearing field")
                          elif isinstance(child, (Mapping, list)) and bool(child):
                              errors.append(f"{child_path} is a secret-bearing container")
                      _scan_secrets(child, child_path, errors)
                  return
              if isinstance(value, list):
                  for index, child in enumerate(value):
                      _scan_secrets(child, f"{path}[{index}]", errors)
                  return
              if isinstance(value, str):
                  for pattern in _SECRET_VALUE_PATTERNS:
                      if pattern.search(value):
                          errors.append(f"{path} contains material matching a secret pattern")
                          break


          def _check_identifier(value: Any, path: str, errors: list[str]) -> str | None:
              if not isinstance(value, str):
                  errors.append(f"{path} must be a string")
                  return None
              if not _ID_RE.fullmatch(value):
                  errors.append(f"{path} is not a canonical identifier: {value!r}")
                  return None
              return value


          def _check_domain(value: Any, path: str, errors: list[str]) -> str | None:
              if not isinstance(value, str) or value not in DOMAINS:
                  errors.append(f"{path} must be one of {', '.join(DOMAINS)}")
                  return None
              return value


          def _check_ref_list(value: Any, path: str, errors: list[str]) -> list[str]:
              if not isinstance(value, list):
                  errors.append(f"{path} must be an array")
                  return []
              refs: list[str] = []
              for index, item in enumerate(value):
                  ref = _check_identifier(item, f"{path}[{index}]", errors)
                  if ref is not None:
                      refs.append(ref)
              if len(refs) != len(set(refs)):
                  errors.append(f"{path} contains duplicate references")
              return refs


          def validate_contract(document: Mapping[str, Any], *, require_sealed: bool = True) -> None:
              """Validate structure, references, coverage, digests, and secret safety."""

              errors: list[str] = []
              if not isinstance(document, Mapping):
                  raise ContractValidationError(("document must be an object",))
              _valid_json_value(document, "$", errors)
              _scan_secrets(document, "$", errors)
              allowed = {
                  "schema",
                  "contract_id",
                  "source_revision",
                  "generator",
                  "canonical_sha256",
                  "coverage",
                  "fragments",
                  "entities",
                  "relations",
                  "rules",
                  "claims",
                  "evidence",
                  "compatibility_views",
              }
              extras = sorted(set(document) - allowed)
              if extras:
                  errors.append("unknown top-level fields: " + ", ".join(extras))
              _add_error(errors, document.get("schema") == SCHEMA_ID, f"schema must equal {SCHEMA_ID}")
              _check_identifier(document.get("contract_id"), "$.contract_id", errors)
              _add_error(errors, isinstance(document.get("source_revision"), str), "source_revision must be a string")
              _add_error(errors, isinstance(document.get("generator"), str), "generator must be a string")

              identifiers: dict[str, str] = {}
              collection_ids: dict[str, set[str]] = {name: set() for name in (*COLLECTIONS, "fragments")}
              records_by_collection: dict[str, list[Mapping[str, Any]]] = {}
              for collection in (*COLLECTIONS, "fragments"):
                  raw_records = document.get(collection)
                  if not isinstance(raw_records, list):
                      errors.append(f"$.{collection} must be an array")
                      records_by_collection[collection] = []
                      continue
                  records: list[Mapping[str, Any]] = []
                  for index, raw in enumerate(raw_records):
                      path = f"$.{collection}[{index}]"
                      if not isinstance(raw, Mapping):
                          errors.append(f"{path} must be an object")
                          continue
                      records.append(raw)
                      identifier = _check_identifier(
                          raw.get("fragment_id" if collection == "fragments" else "id"),
                          f"{path}.{'fragment_id' if collection == 'fragments' else 'id'}",
                          errors,
                      )
                      _check_domain(raw.get("domain"), f"{path}.domain", errors)
                      if identifier is not None:
                          if identifier in identifiers:
                              errors.append(
                                  f"{path} reuses identifier {identifier!r} already owned by {identifiers[identifier]}"
                              )
                          else:
                              identifiers[identifier] = path
                              collection_ids[collection].add(identifier)
                  records_by_collection[collection] = records

              entity_ids = collection_ids["entities"]
              relation_ids = collection_ids["relations"]
              evidence_ids = collection_ids["evidence"]
              subject_ids = entity_ids | relation_ids | collection_ids["rules"] | collection_ids["claims"]

              for index, entity in enumerate(records_by_collection["entities"]):
                  path = f"$.entities[{index}]"
                  _add_error(errors, isinstance(entity.get("kind"), str), f"{path}.kind must be a string")
                  _add_error(errors, isinstance(entity.get("attributes", {}), Mapping), f"{path}.attributes must be an object")
                  refs = _check_ref_list(entity.get("evidence_refs", []), f"{path}.evidence_refs", errors)
                  for ref in refs:
                      if ref not in evidence_ids:
                          errors.append(f"{path}.evidence_refs contains orphan {ref!r}")

              for index, relation in enumerate(records_by_collection["relations"]):
                  path = f"$.relations[{index}]"
                  _add_error(errors, isinstance(relation.get("kind"), str), f"{path}.kind must be a string")
                  source = _check_identifier(relation.get("source"), f"{path}.source", errors)
                  target = _check_identifier(relation.get("target"), f"{path}.target", errors)
                  if source is not None and source not in entity_ids:
                      errors.append(f"{path}.source contains orphan {source!r}")
                  if target is not None and target not in entity_ids:
                      errors.append(f"{path}.target contains orphan {target!r}")
                  _add_error(errors, isinstance(relation.get("attributes", {}), Mapping), f"{path}.attributes must be an object")
                  refs = _check_ref_list(relation.get("evidence_refs", []), f"{path}.evidence_refs", errors)
                  for ref in refs:
                      if ref not in evidence_ids:
                          errors.append(f"{path}.evidence_refs contains orphan {ref!r}")

              for collection in ("rules", "claims"):
                  for index, assertion in enumerate(records_by_collection[collection]):
                      path = f"$.{collection}[{index}]"
                      _add_error(errors, isinstance(assertion.get("kind"), str), f"{path}.kind must be a string")
                      _add_error(errors, isinstance(assertion.get("statement"), str), f"{path}.statement must be a string")
                      for ref in _check_ref_list(assertion.get("subject_refs", []), f"{path}.subject_refs", errors):
                          if ref not in entity_ids | relation_ids:
                              errors.append(f"{path}.subject_refs contains orphan {ref!r}")
                      for ref in _check_ref_list(assertion.get("evidence_refs", []), f"{path}.evidence_refs", errors):
                          if ref not in evidence_ids:
                              errors.append(f"{path}.evidence_refs contains orphan {ref!r}")

              for index, evidence in enumerate(records_by_collection["evidence"]):
                  path = f"$.evidence[{index}]"
                  source = evidence.get("source")
                  _add_error(errors, isinstance(source, Mapping), f"{path}.source must be an object")
                  if isinstance(source, Mapping):
                      _add_error(errors, isinstance(source.get("source_id"), str), f"{path}.source.source_id must be a string")
                      _add_error(errors, isinstance(source.get("locator"), str), f"{path}.source.locator must be a string")
                      digest = source.get("sha256")
                      if digest is not None and (not isinstance(digest, str) or not _DIGEST_RE.fullmatch(digest)):
                          errors.append(f"{path}.source.sha256 must be a lowercase SHA-256 digest")
                  for ref in _check_ref_list(evidence.get("subject_refs", []), f"{path}.subject_refs", errors):
                      if ref not in subject_ids:
                          errors.append(f"{path}.subject_refs contains orphan {ref!r}")
                  _add_error(errors, isinstance(evidence.get("attributes", {}), Mapping), f"{path}.attributes must be an object")

              ref_targets = {
                  "entity_refs": entity_ids,
                  "relation_refs": relation_ids,
                  "rule_refs": collection_ids["rules"],
                  "claim_refs": collection_ids["claims"],
                  "evidence_refs": evidence_ids,
              }
              fragment_domains: list[str] = []
              for index, fragment in enumerate(records_by_collection["fragments"]):
                  path = f"$.fragments[{index}]"
                  domain = fragment.get("domain")
                  if isinstance(domain, str):
                      fragment_domains.append(domain)
                  for field, targets in ref_targets.items():
                      for ref in _check_ref_list(fragment.get(field, []), f"{path}.{field}", errors):
                          if ref not in targets:
                              errors.append(f"{path}.{field} contains orphan {ref!r}")

              coverage = document.get("coverage")
              if not isinstance(coverage, Mapping):
                  errors.append("$.coverage must be an object")
              else:
                  required = coverage.get("required_domains")
                  present = coverage.get("present_domains")
                  _add_error(errors, required == list(DOMAINS), "coverage.required_domains must enumerate all canonical domains")
                  expected_present = [domain for domain in DOMAINS if domain in _defined_domains(document)]
                  _add_error(errors, present == expected_present, "coverage.present_domains is not derived from the contract")
                  missing = sorted(set(DOMAINS) - set(fragment_domains))
                  if missing:
                      errors.append("missing canonical fragments: " + ", ".join(missing))

              views = document.get("compatibility_views")
              if not isinstance(views, list):
                  errors.append("$.compatibility_views must be an array")
                  views = []
              names: set[str] = set()
              digest = document.get("canonical_sha256")
              if require_sealed:
                  if not isinstance(digest, str) or not _DIGEST_RE.fullmatch(digest):
                      errors.append("canonical_sha256 must be a lowercase SHA-256 digest")
                  else:
                      expected_digest = canonical_sha256(_digest_projection(_normalise(document)))
                      if digest != expected_digest:
                          errors.append("canonical_sha256 does not match the canonical projection")
              for index, view in enumerate(views):
                  path = f"$.compatibility_views[{index}]"
                  if not isinstance(view, Mapping):
                      errors.append(f"{path} must be an object")
                      continue
                  name = view.get("name")
                  _add_error(errors, isinstance(name, str) and bool(name), f"{path}.name must be a non-empty string")
                  if isinstance(name, str):
                      if name in names:
                          errors.append(f"duplicate compatibility view {name!r}")
                      names.add(name)
                  _add_error(errors, view.get("authoritative") is False, f"{path}.authoritative must be false")
                  if require_sealed and isinstance(digest, str):
                      _add_error(
                          errors,
                          view.get("source_contract_sha256") == digest,
                          f"{path}.source_contract_sha256 is stale",
                      )
                      _add_error(
                          errors,
                          view.get("representation_sha256") == canonical_sha256(view.get("representation")),
                          f"{path}.representation_sha256 is stale",
                      )

              if errors:
                  raise ContractValidationError(errors)


          def _fragment_refs(fragment: Mapping[str, Any], collection: str) -> list[str]:
              explicit = fragment.get(f"{collection[:-1]}_refs" if collection != "entities" else "entity_refs")
              if isinstance(explicit, list):
                  return list(explicit)
              return [
                  record["id"]
                  for record in fragment.get(collection, [])
                  if isinstance(record, Mapping) and isinstance(record.get("id"), str)
              ]


          def compose_contract(
              fragments: Iterable[Mapping[str, Any]],
              *,
              contract_id: str,
              source_revision: str,
              generator: str = "codex-wire-audit",
              compatibility_views: Iterable[Mapping[str, Any]] = (),
          ) -> dict[str, Any]:
              """Compose canonical fragments into one sealed semantic authority."""

              document: dict[str, Any] = {
                  "schema": SCHEMA_ID,
                  "contract_id": contract_id,
                  "source_revision": source_revision,
                  "generator": generator,
                  "coverage": {"required_domains": list(DOMAINS), "present_domains": []},
                  "fragments": [],
                  "entities": [],
                  "relations": [],
                  "rules": [],
                  "claims": [],
                  "evidence": [],
                  "compatibility_views": [copy.deepcopy(dict(view)) for view in compatibility_views],
              }
              for raw_fragment in fragments:
                  fragment = copy.deepcopy(dict(raw_fragment))
                  domain = fragment.get("domain")
                  if domain not in DOMAINS:
                      raise ContractValidationError((f"fragment domain is not canonical: {domain!r}",))
                  fragment_id = fragment.get("fragment_id", f"fragment.{domain}")
                  for collection in COLLECTIONS:
                      records = fragment.pop(collection, [])
                      if not isinstance(records, list):
                          raise ContractValidationError((f"{fragment_id}.{collection} must be an array",))
                      for record in records:
                          if not isinstance(record, dict):
                              raise ContractValidationError((f"{fragment_id}.{collection} contains a non-object",))
                          record.setdefault("domain", domain)
                          if collection in ("entities", "relations"):
                              record.setdefault("attributes", {})
                              record.setdefault("evidence_refs", [])
                          elif collection in ("rules", "claims"):
                              record.setdefault("subject_refs", [])
                              record.setdefault("evidence_refs", [])
                          else:
                              record.setdefault("subject_refs", [])
                              record.setdefault("attributes", {})
                          document[collection].append(record)
                      fragment[f"{collection[:-1]}_refs" if collection != "entities" else "entity_refs"] = [
                          record["id"] for record in records if isinstance(record.get("id"), str)
                      ]
                  fragment["fragment_id"] = fragment_id
                  for field in ("entity_refs", "relation_refs", "rule_refs", "claim_refs", "evidence_refs"):
                      fragment.setdefault(field, [])
                  document["fragments"].append(fragment)
              return seal_contract(document)


          def fragment_from_legacy_report(
              domain: str,
              report: Any,
              *,
              source_id: str,
              locator: str,
          ) -> dict[str, Any]:
              """Create a lossless-identity, content-safe bridge for an older report.

              The report body is deliberately not embedded. Its deterministic digest and
              structural inventory become evidence while the report remains a derived view.
              """

              if domain not in DOMAINS:
                  raise ContractValidationError((f"unknown domain {domain!r}",))
              digest = canonical_sha256(report)
              entity_id = f"entity.{domain}.legacy-report"
              evidence_id = f"evidence.{domain}.legacy-report"
              keys = sorted(report) if isinstance(report, Mapping) else []
              size = len(report) if isinstance(report, (Mapping, Sequence)) and not isinstance(report, str) else 1
              return {
                  "fragment_id": f"fragment.{domain}",
                  "domain": domain,
                  "entities": [
                      {
                          "id": entity_id,
                          "kind": "legacy_report_snapshot",
                          "attributes": {"report_sha256": digest, "top_level_keys": keys, "record_count": size},
                          "evidence_refs": [evidence_id],
                      }
                  ],
                  "relations": [],
                  "rules": [],
                  "claims": [
                      {
                          "id": f"claim.{domain}.legacy-report-derived",
                          "kind": "compatibility",
                          "statement": "The legacy report is evidence for, not authority over, the canonical contract.",
                          "subject_refs": [entity_id],
                          "evidence_refs": [evidence_id],
                      }
                  ],
                  "evidence": [
                      {
                          "id": evidence_id,
                          "source": {"source_id": source_id, "locator": locator, "sha256": digest},
                          "subject_refs": [entity_id],
                          "attributes": {"embedded": False},
                      }
                  ],
              }


          def example_fragments() -> list[dict[str, Any]]:
              """Return a compact, fully connected example covering all domains."""

              specs = {
                  "configuration": ("config_root", "configuration root", "source.config"),
                  "resolution": ("effective_config", "effective configuration", "source.resolution"),
                  "environment": ("process_environment", "process environment", "source.environment"),
                  "lifecycle": ("thread", "thread lifecycle", "source.lifecycle"),
                  "turn": ("turn", "turn metadata", "source.turn"),
                  "local_storage": ("rollout", "rollout revision", "source.local-storage"),
              }
              fragments: list[dict[str, Any]] = []
              for domain, (suffix, label, source_id) in specs.items():
                  entity_id = f"entity.{domain}.{suffix}"
                  evidence_id = f"evidence.{domain}.source"
                  fragments.append(
                      {
                          "fragment_id": f"fragment.{domain}",
                          "domain": domain,
                          "entities": [
                              {
                                  "id": entity_id,
                                  "kind": suffix,
                                  "attributes": {"label": label},
                                  "evidence_refs": [evidence_id],
                              }
                          ],
                          "relations": [],
                          "rules": [
                              {
                                  "id": f"rule.{domain}.evidence-required",
                                  "kind": "integrity",
                                  "statement": "Every semantic object is linked to source evidence.",
                                  "subject_refs": [entity_id],
                                  "evidence_refs": [evidence_id],
                              }
                          ],
                          "claims": [
                              {
                                  "id": f"claim.{domain}.captured",
                                  "kind": "coverage",
                                  "statement": f"The {label} domain is represented canonically.",
                                  "subject_refs": [entity_id],
                                  "evidence_refs": [evidence_id],
                              }
                          ],
                          "evidence": [
                              {
                                  "id": evidence_id,
                                  "source": {"source_id": source_id, "locator": f"example/{domain}"},
                                  "subject_refs": [entity_id],
                                  "attributes": {"example": True},
                              }
                          ],
                      }
                  )
              entity = {fragment["domain"]: fragment["entities"][0]["id"] for fragment in fragments}
              relations = [
                  ("resolution", "resolves_to", entity["configuration"], entity["resolution"]),
                  ("environment", "influences", entity["environment"], entity["resolution"]),
                  ("lifecycle", "owns", entity["lifecycle"], entity["turn"]),
                  ("turn", "persists_as", entity["turn"], entity["local_storage"]),
              ]
              by_domain = {fragment["domain"]: fragment for fragment in fragments}
              for index, (domain, kind, source, target) in enumerate(relations, 1):
                  evidence_id = by_domain[domain]["evidence"][0]["id"]
                  by_domain[domain]["relations"].append(
                      {
                          "id": f"relation.{domain}.{index}",
                          "kind": kind,
                          "source": source,
                          "target": target,
                          "attributes": {},
                          "evidence_refs": [evidence_id],
                      }
                  )
              return fragments


          def example_contract(source_revision: str = "example") -> dict[str, Any]:
              views = [
                  {
                      "name": "config_surface",
                      "authoritative": False,
                      "representation": {
                          "root": "entity.configuration.config_root",
                          "effective": "entity.resolution.effective_config",
                      },
                  },
                  {
                      "name": "local_storage_layout",
                      "authoritative": False,
                      "representation": {
                          "turn": "entity.turn.turn",
                          "rollout": "entity.local_storage.rollout",
                      },
                  },
              ]
              return compose_contract(
                  example_fragments(),
                  contract_id="contract.codex.connected-system",
                  source_revision=source_revision,
                  compatibility_views=views,
              )


          def schema_document() -> dict[str, Any]:
              """Return the checked-in JSON Schema as an ordinary JSON value."""

              identifier = {"type": "string", "pattern": ID_PATTERN}
              domain = {"type": "string", "enum": list(DOMAINS)}
              refs = {"type": "array", "items": copy.deepcopy(identifier), "uniqueItems": True}
              attributes = {"type": "object"}
              source = {
                  "type": "object",
                  "required": ["source_id", "locator"],
                  "properties": {
                      "source_id": {"type": "string", "minLength": 1},
                      "locator": {"type": "string", "minLength": 1},
                      "sha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
                  },
                  "additionalProperties": False,
              }
              entity = {
                  "type": "object",
                  "required": ["id", "kind", "domain", "attributes", "evidence_refs"],
                  "properties": {
                      "id": copy.deepcopy(identifier),
                      "kind": {"type": "string", "minLength": 1},
                      "domain": copy.deepcopy(domain),
                      "attributes": copy.deepcopy(attributes),
                      "evidence_refs": copy.deepcopy(refs),
                  },
                  "additionalProperties": False,
              }
              relation = {
                  "type": "object",
                  "required": ["id", "kind", "domain", "source", "target", "attributes", "evidence_refs"],
                  "properties": {
                      "id": copy.deepcopy(identifier),
                      "kind": {"type": "string", "minLength": 1},
                      "domain": copy.deepcopy(domain),
                      "source": copy.deepcopy(identifier),
                      "target": copy.deepcopy(identifier),
                      "attributes": copy.deepcopy(attributes),
                      "evidence_refs": copy.deepcopy(refs),
                  },
                  "additionalProperties": False,
              }
              assertion = {
                  "type": "object",
                  "required": ["id", "kind", "domain", "statement", "subject_refs", "evidence_refs"],
                  "properties": {
                      "id": copy.deepcopy(identifier),
                      "kind": {"type": "string", "minLength": 1},
                      "domain": copy.deepcopy(domain),
                      "statement": {"type": "string", "minLength": 1},
                      "subject_refs": copy.deepcopy(refs),
                      "evidence_refs": copy.deepcopy(refs),
                  },
                  "additionalProperties": False,
              }
              evidence = {
                  "type": "object",
                  "required": ["id", "domain", "source", "subject_refs", "attributes"],
                  "properties": {
                      "id": copy.deepcopy(identifier),
                      "domain": copy.deepcopy(domain),
                      "source": source,
                      "subject_refs": copy.deepcopy(refs),
                      "attributes": copy.deepcopy(attributes),
                  },
                  "additionalProperties": False,
              }
              fragment_properties = {
                  "fragment_id": copy.deepcopy(identifier),
                  "domain": copy.deepcopy(domain),
                  "entity_refs": copy.deepcopy(refs),
                  "relation_refs": copy.deepcopy(refs),
                  "rule_refs": copy.deepcopy(refs),
                  "claim_refs": copy.deepcopy(refs),
                  "evidence_refs": copy.deepcopy(refs),
              }
              fragment = {
                  "type": "object",
                  "required": list(fragment_properties),
                  "properties": fragment_properties,
                  "additionalProperties": False,
              }
              view = {
                  "type": "object",
                  "required": [
                      "name",
                      "authoritative",
                      "representation",
                      "source_contract_sha256",
                      "representation_sha256",
                  ],
                  "properties": {
                      "name": {"type": "string", "minLength": 1},
                      "authoritative": {"const": False},
                      "representation": {},
                      "source_contract_sha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
                      "representation_sha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
                  },
                  "additionalProperties": False,
              }
              return {
                  "$schema": "https://json-schema.org/draft/2020-12/schema",
                  "$id": SCHEMA_URI,
                  "title": "Canonical Codex connected-system contract",
                  "description": "Machine-readable semantic authority for Codex configuration, resolution, environment, lifecycle, turn, and local-storage evidence.",
                  "type": "object",
                  "required": [
                      "schema",
                      "contract_id",
                      "source_revision",
                      "generator",
                      "canonical_sha256",
                      "coverage",
                      "fragments",
                      "entities",
                      "relations",
                      "rules",
                      "claims",
                      "evidence",
                      "compatibility_views",
                  ],
                  "properties": {
                      "schema": {"const": SCHEMA_ID},
                      "contract_id": copy.deepcopy(identifier),
                      "source_revision": {"type": "string"},
                      "generator": {"type": "string", "minLength": 1},
                      "canonical_sha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
                      "coverage": {
                          "type": "object",
                          "required": ["required_domains", "present_domains"],
                          "properties": {
                              "required_domains": {"const": list(DOMAINS)},
                              "present_domains": {
                                  "type": "array",
                                  "items": copy.deepcopy(domain),
                                  "uniqueItems": True,
                              },
                          },
                          "additionalProperties": False,
                      },
                      "fragments": {"type": "array", "items": fragment, "minItems": len(DOMAINS)},
                      "entities": {"type": "array", "items": entity},
                      "relations": {"type": "array", "items": relation},
                      "rules": {"type": "array", "items": copy.deepcopy(assertion)},
                      "claims": {"type": "array", "items": copy.deepcopy(assertion)},
                      "evidence": {"type": "array", "items": evidence},
                      "compatibility_views": {"type": "array", "items": view},
                  },
                  "additionalProperties": False,
              }
          ''',
              'toolchain/tools/check_system_contract.py': r'''
          #!/usr/bin/env python3
          """Compose, validate, and emit ``codex-system-contract/v1`` documents."""

          from __future__ import annotations

          import argparse
          import copy
          import json
          import sys
          from pathlib import Path
          from typing import Any

          TOOLCHAIN = Path(__file__).resolve().parents[1]
          if str(TOOLCHAIN) not in sys.path:
              sys.path.insert(0, str(TOOLCHAIN))

          from codex_wire_audit.system_contract import (  # noqa: E402
              ContractValidationError,
              compose_contract,
              example_contract,
              fragment_from_legacy_report,
              schema_document,
              validate_contract,
          )


          def _read_json(path: Path) -> Any:
              return json.loads(path.read_text(encoding="utf-8"))


          def _write_json(path: Path, value: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(value, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )


          def _parse_fragment(spec: str) -> dict[str, Any]:
              if "=" not in spec:
                  raise ValueError("fragment must use DOMAIN=PATH syntax")
              domain, raw_path = spec.split("=", 1)
              path = Path(raw_path)
              value = _read_json(path)
              if isinstance(value, dict) and value.get("domain") == domain and "fragment_id" in value:
                  return value
              return fragment_from_legacy_report(
                  domain,
                  value,
                  source_id=f"file.{path.name}",
                  locator=str(path),
              )


          def _self_test(source_revision: str) -> dict[str, Any]:
              first = example_contract(source_revision)
              second = example_contract(source_revision)
              if first != second:
                  raise SystemExit("canonical composition is not deterministic")
              validate_contract(first)

              orphan = copy.deepcopy(first)
              orphan["relations"][0]["target"] = "entity.missing.target"
              try:
                  validate_contract(orphan)
              except ContractValidationError:
                  pass
              else:
                  raise SystemExit("orphan reference was accepted")

              leaked = copy.deepcopy(first)
              leaked["entities"][0]["attributes"]["api_key"] = "sk-examplematerial1234567890"
              try:
                  validate_contract(leaked)
              except ContractValidationError:
                  pass
              else:
                  raise SystemExit("secret-bearing field was accepted")

              stale = copy.deepcopy(first)
              stale["compatibility_views"][0]["representation"]["root"] = "entity.changed"
              try:
                  validate_contract(stale)
              except ContractValidationError:
                  pass
              else:
                  raise SystemExit("stale compatibility-view digest was accepted")
              return first


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--input", type=Path, help="validate an existing contract")
              parser.add_argument(
                  "--fragment",
                  action="append",
                  default=[],
                  metavar="DOMAIN=PATH",
                  help="compose a canonical fragment or a digest-bound legacy report",
              )
              parser.add_argument("--output", type=Path, help="write a composed contract")
              parser.add_argument("--schema-output", type=Path, help="write the canonical JSON Schema")
              parser.add_argument("--example-output", type=Path, help="write a sealed six-domain example")
              parser.add_argument("--check-schema", action="store_true", help="compare the checked-in schema with the generator")
              parser.add_argument("--self-test", action="store_true", help="exercise determinism and rejection invariants")
              parser.add_argument("--contract-id", default="contract.codex.connected-system")
              parser.add_argument("--source-revision", default="example")
              parser.add_argument("--generator", default="codex-wire-audit")
              return parser


          def main(argv: list[str] | None = None) -> int:
              args = build_parser().parse_args(argv)
              performed = False
              summaries: list[dict[str, Any]] = []

              generated_schema = schema_document()
              if args.schema_output:
                  _write_json(args.schema_output, generated_schema)
                  performed = True
                  summaries.append({"schema_output": str(args.schema_output)})
              if args.check_schema:
                  checked_in = TOOLCHAIN / "schemas" / "codex-system-contract-v1.schema.json"
                  if _read_json(checked_in) != generated_schema:
                      raise SystemExit(f"generated schema differs from {checked_in}")
                  performed = True
                  summaries.append({"schema": "reproducible"})

              if args.example_output:
                  example = example_contract(args.source_revision)
                  _write_json(args.example_output, example)
                  performed = True
                  summaries.append({"example_output": str(args.example_output), "canonical_sha256": example["canonical_sha256"]})

              if args.input:
                  contract = _read_json(args.input)
                  validate_contract(contract)
                  performed = True
                  summaries.append({"input": str(args.input), "canonical_sha256": contract["canonical_sha256"]})

              if args.fragment:
                  fragments = [_parse_fragment(spec) for spec in args.fragment]
                  contract = compose_contract(
                      fragments,
                      contract_id=args.contract_id,
                      source_revision=args.source_revision,
                      generator=args.generator,
                  )
                  if args.output:
                      _write_json(args.output, contract)
                  else:
                      print(json.dumps(contract, indent=2, sort_keys=True))
                  performed = True
                  summaries.append({"fragments": len(fragments), "canonical_sha256": contract["canonical_sha256"]})

              if args.self_test:
                  contract = _self_test(args.source_revision)
                  performed = True
                  summaries.append({"self_test": "passed", "canonical_sha256": contract["canonical_sha256"]})

              if not performed:
                  build_parser().error("select at least one validation or emission action")
              print(json.dumps({"schema": "codex-system-contract/v1", "results": summaries}, sort_keys=True))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          ''',
              'toolchain/tests/test_system_contract_v1.py': r'''
          from __future__ import annotations

          import copy
          import json
          from pathlib import Path

          import pytest

          from codex_wire_audit.system_contract import (
              DOMAINS,
              ContractValidationError,
              canonical_sha256,
              example_contract,
              fragment_from_legacy_report,
              schema_document,
              validate_contract,
          )


          def test_example_is_deterministic_and_complete() -> None:
              first = example_contract("revision-1")
              second = example_contract("revision-1")
              assert first == second
              assert first["schema"] == "codex-system-contract/v1"
              assert first["coverage"]["present_domains"] == list(DOMAINS)
              assert len(first["fragments"]) == len(DOMAINS)
              validate_contract(first)


          def test_every_reference_is_closed() -> None:
              document = example_contract()
              document["relations"][0]["target"] = "entity.missing.target"
              with pytest.raises(ContractValidationError, match="orphan"):
                  validate_contract(document)


          def test_identifiers_are_globally_unique() -> None:
              document = example_contract()
              document["claims"][0]["id"] = document["entities"][0]["id"]
              with pytest.raises(ContractValidationError, match="reuses identifier"):
                  validate_contract(document)


          @pytest.mark.parametrize(
              "field,value",
              [
                  ("api_key", "sk-examplematerial1234567890"),
                  ("authorization", "Bearer examplematerial123456789012345"),
                  ("private_key", "-----BEGIN PRIVATE KEY-----"),
              ],
          )
          def test_secret_material_is_rejected(field: str, value: str) -> None:
              document = example_contract()
              document["entities"][0]["attributes"][field] = value
              with pytest.raises(ContractValidationError, match="secret"):
                  validate_contract(document)


          def test_compatibility_views_are_digest_bound_and_non_authoritative() -> None:
              document = example_contract()
              assert all(view["authoritative"] is False for view in document["compatibility_views"])
              assert all(view["source_contract_sha256"] == document["canonical_sha256"] for view in document["compatibility_views"])
              document["compatibility_views"][0]["representation"]["root"] = "entity.changed"
              with pytest.raises(ContractValidationError, match="stale"):
                  validate_contract(document)


          def test_canonical_payload_digest_detects_semantic_mutation() -> None:
              document = example_contract()
              original = document["canonical_sha256"]
              document["entities"][0]["attributes"]["label"] = "changed"
              with pytest.raises(ContractValidationError, match="canonical_sha256"):
                  validate_contract(document)
              assert original != canonical_sha256({"changed": True})


          def test_legacy_bridge_embeds_identity_not_report_body() -> None:
              report = {"records": [{"name": "model"}], "status": "ok"}
              fragment = fragment_from_legacy_report(
                  "configuration",
                  report,
                  source_id="test.report",
                  locator="fixture/report.json",
              )
              encoded = json.dumps(fragment)
              assert canonical_sha256(report) in encoded
              assert '"records"' not in encoded


          def test_checked_in_schema_is_reproducible() -> None:
              root = Path(__file__).resolve().parents[1]
              checked_in = json.loads(
                  (root / "schemas" / "codex-system-contract-v1.schema.json").read_text(encoding="utf-8")
              )
              assert checked_in == schema_document()
              assert checked_in["$schema"].endswith("2020-12/schema")
          ''',
              'toolchain/CODEX_SYSTEM_CONTRACT_V1.md': r'''
          # Canonical Codex system contract v1

          `codex-system-contract/v1` is the repository's machine-readable semantic
          authority for the connected Codex system. It composes six evidence domains:
          configuration shape and effects, configuration resolution, process
          environment, session/thread lifecycle, turn metadata, and local storage.

          The contract is an explicit graph rather than a collection of overlapping
          reports. Its records are divided into entities, relations, rules, claims,
          and evidence. Every reference is closed, identifiers are globally unique,
          all six fragments are required, and the deterministic canonical projection
          is bound by `canonical_sha256`.

          Compatibility reports are retained only as derived views. Each view sets
          `authoritative` to `false`, points at the canonical contract digest, and
          carries its own representation digest. A view therefore cannot silently
          drift or become a second source of truth.

          The implementation rejects embedded credential material and common token,
          authorization, private-key, and access-key forms. Legacy reports can be
          bridged without embedding their bodies: the adapter records deterministic
          identity, shape inventory, and source location as evidence.

          ## Checked-in assets

          - `schemas/codex-system-contract-v1.schema.json` — Draft 2020-12 schema.
          - `schemas/codex-system-contract-v1.example.json` — sealed six-domain example.
          - `codex_wire_audit/system_contract.py` — deterministic composer and validator.
          - `tools/check_system_contract.py` — command-line validation and emission.

          Revalidate the checked-in representation with:

          ```bash
          cd toolchain
          python tools/check_system_contract.py \
            --check-schema \
            --input schemas/codex-system-contract-v1.example.json \
            --self-test
          ```
          ''',
