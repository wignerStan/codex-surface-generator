          def node_start(node: ast.AST) -> int:
              decorators = getattr(node, 'decorator_list', [])
              return min([getattr(item, 'lineno', node.lineno) for item in decorators] or [node.lineno])

          def defined_names(node: ast.AST) -> set[str]:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  return {node.name}
              names: set[str] = set()
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      for child in ast.walk(target):
                          if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Store):
                              names.add(child.id)
              return names

          def loaded_names(node: ast.AST) -> set[str]:
              return {
                  child.id
                  for child in ast.walk(node)
                  if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Load)
              }

          def import_block(module: str, names: set[str]) -> str:
              if not names:
                  return ''
              lines = [f'from .{module} import (']
              lines.extend(f'    {name},' for name in sorted(names))
              lines.extend([')', ''])
              return '\n'.join(lines)

          def split_local_storage() -> None:
              path = ROOT / 'toolchain/codex_wire_audit/extractors/local_storage.py'
              if not path.is_file():
                  raise SystemExit(f'missing extractor: {path}')
              source = path.read_text(encoding='utf-8')
              lines = source.splitlines(keepends=True)
              if len(lines) <= 600:
                  return
              tree = ast.parse(source)
              definitions = [
                  node for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
              ]
              if len(definitions) < 3:
                  raise SystemExit('local-storage extractor has too few top-level definitions to split safely')
              first_definition = min(node_start(node) for node in definitions)
              header = ''.join(lines[: first_definition - 1])
              starts = sorted({node_start(node) for node in definitions})
              top_level = list(tree.body)

              def safe_cut(cut: int) -> bool:
                  future: set[str] = set()
                  prefix: list[ast.AST] = []
                  for node in top_level:
                      start = node_start(node)
                      if start >= cut:
                          future.update(defined_names(node))
                      else:
                          prefix.append(node)
                  return not any(loaded_names(node) & future for node in prefix)

              safe = [cut for cut in starts[1:] if safe_cut(cut)]
              choice: tuple[int, int] | None = None
              for first in safe:
                  for second in safe:
                      if second <= first:
                          continue
                      names_a: set[str] = set()
                      names_b: set[str] = set()
                      for node in top_level:
                          start = node_start(node)
                          if start < first:
                              names_a.update(defined_names(node))
                          elif start < second:
                              names_b.update(defined_names(node))
                      block_a = import_block('local_storage_core', names_a)
                      block_b = import_block('local_storage_core', names_a)
                      block_main = import_block('local_storage_core', names_a) + import_block('local_storage_builders', names_b)
                      lengths = (
                          first - 1,
                          len(header.splitlines()) + len(block_a.splitlines()) + second - first,
                          len(header.splitlines()) + len(block_main.splitlines()) + len(lines) - second + 1,
                      )
                      if max(lengths) <= 460:
                          choice = (first, second)
                          break
                  if choice:
                      break

              if choice is not None:
                  first, second = choice
                  names_a: set[str] = set()
                  names_b: set[str] = set()
                  for node in top_level:
                      start = node_start(node)
                      if start < first:
                          names_a.update(defined_names(node))
                      elif start < second:
                          names_b.update(defined_names(node))
                  core = ''.join(lines[: first - 1])
                  builders = header + import_block('local_storage_core', names_a) + ''.join(lines[first - 1 : second - 1])
                  main = (
                      header
                      + import_block('local_storage_core', names_a)
                      + import_block('local_storage_builders', names_b)
                      + ''.join(lines[second - 1 :])
                  )
                  outputs = {
                      path.with_name('local_storage_core.py'): core,
                      path.with_name('local_storage_builders.py'): builders,
                      path: main,
                  }
              else:
                  pair: int | None = None
                  for cut in safe:
                      names: set[str] = set()
                      for node in top_level:
                          if node_start(node) < cut:
                              names.update(defined_names(node))
                      block = import_block('local_storage_support', names)
                      lengths = (
                          cut - 1,
                          len(header.splitlines()) + len(block.splitlines()) + len(lines) - cut + 1,
                      )
                      if max(lengths) <= 575:
                          pair = cut
                          break
                  if pair is None:
                      raise SystemExit('unable to find a dependency-safe local-storage module boundary')
                  names = set()
                  for node in top_level:
                      if node_start(node) < pair:
                          names.update(defined_names(node))
                  outputs = {
                      path.with_name('local_storage_support.py'): ''.join(lines[: pair - 1]),
                      path: header + import_block('local_storage_support', names) + ''.join(lines[pair - 1 :]),
                  }
              for output, value in outputs.items():
                  ast.parse(value)
                  output.write_text(value, encoding='utf-8')
              for output in outputs:
                  if len(output.read_text(encoding='utf-8').splitlines()) > 600:
                      raise SystemExit(f'refactored module still exceeds 600 lines: {output}')

          split_local_storage()

          readme = ROOT / 'README.md'
          marker = '## Canonical machine-readable system contract'
          if readme.is_file() and marker not in readme.read_text(encoding='utf-8'):
              with readme.open('a', encoding='utf-8') as handle:
                  handle.write(textwrap.dedent(r'''

                  ## Canonical machine-readable system contract

                  The sole semantic authority for connected configuration, resolution,
                  environment, lifecycle, turn, and local-storage evidence is
                  `codex-system-contract/v1`. The checked-in Draft 2020-12 schema,
                  deterministic example, validator, and proof workflow live under
                  `toolchain/`; compatibility reports are explicitly non-authoritative
                  and digest-bound to the canonical contract.
                  ''').lstrip('\n'))

          for stale in (
              ROOT / '.github/canonical_bootstrap_v2.py',
              ROOT / '.github/workflows/canonical-representation-v2.yml',
          ):
              stale.unlink(missing_ok=True)

          subprocess.run(
              [
                  sys.executable,
                  'toolchain/tools/check_system_contract.py',
                  '--schema-output',
                  'toolchain/schemas/codex-system-contract-v1.schema.json',
                  '--example-output',
                  'toolchain/schemas/codex-system-contract-v1.example.json',
                  '--source-revision',
                  '6af345407d9c2a568da9d01b6c4b81a9e61495c0',
              ],
              check=True,
          )
          PY

      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Validate source, schema, assets, and maintainability
        run: |
          set -euo pipefail
          mkdir -p toolchain/ci-out/canonical-contract
          if test -f toolchain/tools/check_architecture_docs.py; then
            python toolchain/tools/check_architecture_docs.py \
              | tee toolchain/ci-out/canonical-contract/architecture-docs.txt
          fi
          cd toolchain
          make compile
          python -m pytest -q | tee ci-out/canonical-contract/pytest.txt
          make check-assets | tee ci-out/canonical-contract/check-assets.txt
          python tools/maintainability_metrics.py --check \
            | tee ci-out/canonical-contract/maintainability.txt
          python tools/check_system_contract.py \
            --check-schema \
            --input schemas/codex-system-contract-v1.example.json \
            --self-test \
            --source-revision "$PINNED_CODEX_SHA" \
            | tee ci-out/canonical-contract/system-contract.txt
          python -m codex_wire_audit.release_contract \
            --output ci-out/canonical-contract/source-capability-probe.json

      - name: Validate pinned Codex configuration surface
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          mkdir -p toolchain/ci-out/canonical-contract/pinned
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output toolchain/ci-out/canonical-contract/pinned/config-integration.json \
            --schema-output toolchain/ci-out/canonical-contract/pinned/config-schema.json \
            --graph-output toolchain/ci-out/canonical-contract/pinned/config-surface-graph.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-machine-schema-bootstrap-proof
          path: toolchain/ci-out/canonical-contract
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the ordinary source representation
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-canonical-machine-schema.yml
          rm -rf toolchain/ci-out toolchain/.pytest_cache toolchain/.mypy_cache toolchain/.ruff_cache
          rm -rf toolchain/codex_wire_audit.egg-info toolchain/build toolchain/dist
          rm -f toolchain/.coverage toolchain/coverage.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'feat: publish canonical machine-readable system contract' \
            -m 'Adds codex-system-contract/v1 as the deterministic semantic authority, binds compatibility views by digest, enforces reference closure and secret safety, repairs the local-storage maintainability gate, and replaces the broken recovery path with a read-only permanent proof workflow.'
          printf '{"parent":"%s","candidate":"%s"}\n' \
            "$(git rev-parse HEAD^)" "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/canonical-publication.json"

      - name: Guard and fast-forward main
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor origin/main HEAD
          git push origin "HEAD:refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$candidate"
          cp "$RUNNER_TEMP/canonical-publication.json" toolchain/canonical-publication.json

      - name: Delete the successful bootstrap branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['BOOTSTRAP_BRANCH']
          token = os.environ['GH_TOKEN']
          ref = urllib.parse.quote(f'heads/{branch}', safe='/')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/refs/{ref}',
              method='DELETE',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'canonical-machine-schema-bootstrap',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print(response.status)
          except urllib.error.HTTPError as error:
              if error.code not in {404, 422}:
                  raise
          PY
