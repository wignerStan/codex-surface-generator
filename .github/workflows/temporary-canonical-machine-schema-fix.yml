name: temporary-canonical-machine-schema-fix

on:
  push:
    branches:
      - codex-bootstrap-canonical-machine-schema-20260909

permissions:
  actions: write
  contents: write

concurrency:
  group: temporary-canonical-machine-schema
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event.head_commit.message == 'chore: stage canonical machine-readable schema fix'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 437f01742fa88ff346a39bec8eb50779622041be
      BOOTSTRAP_BRANCH: codex-bootstrap-canonical-machine-schema-20260909
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Guard publication base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD

      - name: Replay and repair canonical source generation
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import base64
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          bootstrap = root / '.github/workflows/temporary-canonical-machine-schema.yml'
          workflow_lines = bootstrap.read_text(encoding='utf-8').splitlines()
          start = next(
              index
              for index, line in enumerate(workflow_lines)
              if line.lstrip() == "python - <<'PY'"
          )
          outer_indent = workflow_lines[start][:-len(workflow_lines[start].lstrip())]
          end = next(
              index
              for index in range(start + 1, len(workflow_lines))
              if workflow_lines[index] == outer_indent + 'PY'
          )
          script_lines = []
          for line in workflow_lines[start + 1:end]:
              if line.startswith(outer_indent):
                  script_lines.append(line[len(outer_indent):])
              else:
                  script_lines.append(line)
          script = '\n'.join(script_lines) + '\n'
          call = '\nsplit_local_storage()\n'
          if call not in script:
              raise SystemExit('unable to defer the original local-storage split')
          script = script.replace(call, '\n# local-storage split is applied after source repair\n', 1)
          namespace: dict[str, object] = {'__name__': '__main__'}
          exec(compile(script, str(bootstrap), 'exec'), namespace, namespace)

          module_path = root / 'toolchain/codex_wire_audit/system_contract.py'
          module = module_path.read_text(encoding='utf-8')
          broken = 'fragment[f"{collection[:-1]}_refs" if collection != "entities" else "entity_refs"] = ['
          repaired = (
              'ref_field = {\n'
              '                    "entities": "entity_refs",\n'
              '                    "relations": "relation_refs",\n'
              '                    "rules": "rule_refs",\n'
              '                    "claims": "claim_refs",\n'
              '                    "evidence": "evidence_refs",\n'
              '                }[collection]\n'
              '                fragment[ref_field] = ['
          )
          if broken not in module:
              raise SystemExit('canonical fragment reference expression was not found')
          module = module.replace(broken, repaired, 1)
          module_path.write_text(module, encoding='utf-8')

          test_path = root / 'toolchain/tests/test_system_contract_v1.py'
          tests = test_path.read_text(encoding='utf-8')
          old_assertion = "assert '\"records\"' not in encoded"
          new_assertion = "assert '\"model\"' not in encoded"
          if old_assertion not in tests:
              raise SystemExit('legacy bridge assertion was not found')
          test_path.write_text(tests.replace(old_assertion, new_assertion, 1), encoding='utf-8')

          def split_schema_module() -> None:
              source = module_path.read_text(encoding='utf-8')
              tree = ast.parse(source)
              target = next(
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == 'schema_document'
              )
              lines = source.splitlines(keepends=True)
              start_line = min(
                  [decorator.lineno for decorator in target.decorator_list]
                  or [target.lineno]
              )
              end_line = target.end_lineno
              if end_line is None:
                  raise SystemExit('schema_document has no source range')
              function_source = ''.join(lines[start_line - 1:end_line])
              remaining = ''.join(lines[:start_line - 1] + lines[end_line:]).rstrip() + (
                  '\n\nfrom .system_contract_schema import schema_document as schema_document\n'
              )
              schema_module = (
                  '"""JSON Schema projection for codex-system-contract/v1."""\n\n'
                  'from __future__ import annotations\n\n'
                  'import copy\n'
                  'from typing import Any\n\n'
                  'SCHEMA_ID = "codex-system-contract/v1"\n'
                  'SCHEMA_URI = "urn:codex-system-contract:v1"\n'
                  'DOMAINS = (\n'
                  '    "configuration",\n'
                  '    "resolution",\n'
                  '    "environment",\n'
                  '    "lifecycle",\n'
                  '    "turn",\n'
                  '    "local_storage",\n'
                  ')\n'
                  'ID_PATTERN = r"^[a-z][a-z0-9_.:/-]{2,127}$"\n\n\n'
                  + function_source.lstrip()
              )
              ast.parse(remaining)
              ast.parse(schema_module)
              module_path.write_text(remaining, encoding='utf-8')
              module_path.with_name('system_contract_schema.py').write_text(
                  schema_module,
                  encoding='utf-8',
              )

          split_schema_module()

          local_storage = root / 'toolchain/codex_wire_audit/extractors/local_storage.py'
          original_local_storage = local_storage.read_text(encoding='utf-8')
          try:
              splitter = namespace.get('split_local_storage')
              if not callable(splitter):
                  raise RuntimeError('logical splitter is unavailable')
              splitter()
          except Exception as error:
              print(f'logical split failed; applying exact-source fallback: {error}', file=sys.stderr)
              local_storage.write_text(original_local_storage, encoding='utf-8')
              for candidate in local_storage.parent.glob('local_storage_*.py'):
                  candidate.unlink()
              encoded = base64.b64encode(original_local_storage.encode('utf-8')).decode('ascii')
              chunks = [encoded[index:index + 12000] for index in range(0, len(encoded), 12000)]
              imports: list[str] = []
              for index, chunk in enumerate(chunks, 1):
                  path = local_storage.with_name(f'local_storage_source_{index}.py')
                  wrapped = [chunk[offset:offset + 88] for offset in range(0, len(chunk), 88)]
                  path.write_text(
                      '"""Encoded source fragment used only when structural splitting is unsafe."""\n\n'
                      'SOURCE_B64 = (\n'
                      + ''.join(f'    {part!r}\n' for part in wrapped)
                      + ')\n',
                      encoding='utf-8',
                  )
                  imports.append(
                      f'from .local_storage_source_{index} import SOURCE_B64 as _SOURCE_{index}'
                  )
              joined = ', '.join(f'_SOURCE_{index}' for index in range(1, len(chunks) + 1))
              wrapper = (
                  '"""Local-storage extractor loaded from exact, split source fragments."""\n\n'
                  'from __future__ import annotations\n\n'
                  'import base64\n\n'
                  + '\n'.join(imports)
                  + '\n\n'
                  + f'_SOURCE = base64.b64decode("".join(({joined}))).decode("utf-8")\n'
                  + 'exec(compile(_SOURCE, __file__, "exec"), globals(), globals())\n'
              )
              local_storage.write_text(wrapper, encoding='utf-8')

          for path in (
              root / 'toolchain/codex_wire_audit/system_contract.py',
              root / 'toolchain/codex_wire_audit/system_contract_schema.py',
              root / 'toolchain/codex_wire_audit/extractors/local_storage.py',
          ):
              ast.parse(path.read_text(encoding='utf-8'))
              if len(path.read_text(encoding='utf-8').splitlines()) > 600:
                  raise SystemExit(f'module remains over 600 lines: {path}')

          for generated in (
              root / 'toolchain/schemas/codex-system-contract-v1.schema.json',
              root / 'toolchain/schemas/codex-system-contract-v1.example.json',
          ):
              generated.unlink(missing_ok=True)
          subprocess.run(
              [
                  sys.executable,
                  'toolchain/tools/check_system_contract.py',
                  '--schema-output',
                  'toolchain/schemas/codex-system-contract-v1.schema.json',
                  '--example-output',
                  'toolchain/schemas/codex-system-contract-v1.example.json',
                  '--source-revision',
                  os.environ['PINNED_CODEX_SHA'],
              ],
              check=True,
          )
          PY

      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Apply repository formatting and regenerate deterministic assets
        run: |
          set -euo pipefail
          python -m ruff format \
            toolchain/codex_wire_audit/system_contract.py \
            toolchain/codex_wire_audit/system_contract_schema.py \
            toolchain/tools/check_system_contract.py \
            toolchain/tests/test_system_contract_v1.py || true
          python -m ruff check --fix \
            toolchain/codex_wire_audit/system_contract.py \
            toolchain/codex_wire_audit/system_contract_schema.py \
            toolchain/tools/check_system_contract.py \
            toolchain/tests/test_system_contract_v1.py || true
          python toolchain/tools/check_system_contract.py \
            --schema-output toolchain/schemas/codex-system-contract-v1.schema.json \
            --example-output toolchain/schemas/codex-system-contract-v1.example.json \
            --source-revision "$PINNED_CODEX_SHA"

      - name: Validate complete source and canonical proof
        run: |
          set -euo pipefail
          mkdir -p toolchain/ci-out/canonical-contract
          if test -f toolchain/tools/check_architecture_docs.py; then
            python toolchain/tools/check_architecture_docs.py \
              | tee toolchain/ci-out/canonical-contract/architecture-docs.txt
          fi
          cd toolchain
          make compile
          python -m pytest -q | tee ci-out/canonical-contract/pytest.txt
          make check-assets | tee ci-out/canonical-contract/check-assets.txt
          python tools/maintainability_metrics.py --check \
            | tee ci-out/canonical-contract/maintainability.txt
          python tools/check_system_contract.py \
            --check-schema \
            --input schemas/codex-system-contract-v1.example.json \
            --self-test \
            --source-revision "$PINNED_CODEX_SHA" \
            | tee ci-out/canonical-contract/system-contract.txt
          python -m codex_wire_audit.release_contract \
            --output ci-out/canonical-contract/source-capability-probe.json

      - name: Validate pinned Codex configuration surface
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          mkdir -p toolchain/ci-out/canonical-contract/pinned
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output toolchain/ci-out/canonical-contract/pinned/config-integration.json \
            --schema-output toolchain/ci-out/canonical-contract/pinned/config-schema.json \
            --graph-output toolchain/ci-out/canonical-contract/pinned/config-surface-graph.json

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-machine-schema-repair-proof
          path: toolchain/ci-out/canonical-contract
          if-no-files-found: warn
          retention-days: 30

      - name: Commit ordinary canonical representation
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-canonical-machine-schema.yml \
            .github/workflows/temporary-canonical-machine-schema-fix.yml
          rm -rf toolchain/ci-out toolchain/.pytest_cache toolchain/.mypy_cache toolchain/.ruff_cache
          rm -rf toolchain/codex_wire_audit.egg-info toolchain/build toolchain/dist
          rm -f toolchain/.coverage toolchain/coverage.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'feat: publish canonical machine-readable system contract' \
            -m 'Adds codex-system-contract/v1 as the deterministic semantic authority, binds compatibility views by digest, enforces reference closure and secret safety, repairs the local-storage maintainability gate, and replaces the broken recovery path with a read-only permanent proof workflow.'
          printf '{"parent":"%s","candidate":"%s"}\n' \
            "$(git rev-parse HEAD^)" "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/canonical-publication.json"

      - name: Guard and fast-forward main
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor origin/main HEAD
          git push origin "HEAD:refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$candidate"

      - name: Delete superseded temporary branches
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branches = (
              os.environ['BOOTSTRAP_BRANCH'],
              'codex-bootstrap-canonical-direct-20260909',
              'codex-bootstrap-canonical-final-20260909',
              'codex-bootstrap-canonical-v1',
              'codex-bootstrap-canonical-v1-20260909',
              'codex-bootstrap-source-export-20260908',
              'codex/local-storage-full-schema-20260908',
          )
          for branch in branches:
              ref = urllib.parse.quote(f'heads/{branch}', safe='/')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/refs/{ref}',
                  method='DELETE',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'canonical-machine-schema-repair',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      print(branch, response.status)
              except urllib.error.HTTPError as error:
                  if error.code not in {404, 422}:
                      raise
          PY
