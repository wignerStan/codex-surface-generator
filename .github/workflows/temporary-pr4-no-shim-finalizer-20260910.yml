name: temporary-pr4-no-shim-finalizer-20260910

on:
  push:
    branches:
      - review/canonical-contract-20260909
    paths:
      - .github/workflows/temporary-pr4-no-shim-finalizer-20260910.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: temporary-pr4-no-shim-finalizer-20260910
  cancel-in-progress: false

jobs:
  finalize-prove-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PR_NUMBER: '4'
      BRANCH: review/canonical-contract-20260909
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Record immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          start_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor origin/main HEAD
          echo "START_SHA=$start_sha" >> "$GITHUB_ENV"
          echo "START_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Install constrained development dependencies
        run: python -m pip install --constraint toolchain/ci/constraints.txt -e './toolchain[test]'

      - name: Repair the known malformed test literal without weakening coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          path = Path('toolchain/tests/test_github_content.py')
          if not path.is_file():
              raise SystemExit('missing GitHub content test')
          text = path.read_text(encoding='utf-8')
          for _ in range(4):
              try:
                  ast.parse(text, filename=str(path))
                  break
              except SyntaxError as error:
                  if 'unterminated string literal' not in error.msg or not error.lineno:
                      raise
                  lines = text.splitlines(keepends=True)
                  index = error.lineno - 1
                  if index + 1 >= len(lines):
                      raise
                  current = lines[index].rstrip('\r\n')
                  following = lines[index + 1]
                  quote = '"' if current.count('"') % 2 else "'"
                  if current.count(quote) % 2 != 1:
                      raise
                  close = following.find(quote)
                  if close < 0:
                      raise
                  lines[index:index + 2] = [current + r'\n' + following]
                  text = ''.join(lines)
          else:
              raise SystemExit('unable to repair malformed test literal')
          ast.parse(text, filename=str(path))
          path.write_text(text, encoding='utf-8')
          PY

      - name: Materialize the direct canonical implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/direct-contract-migration-v2.py
          python .github/direct-contract-migration-v2.py

      - name: Remove every transitional publisher and recovery path
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/direct-contract-migration-v2.py
          rm -f .github/canonical_bootstrap_v2.py
          rm -f .github/workflows/review-canonical-source.yml
          rm -f .github/workflows/canonical-representation-v2.yml
          rm -f .github/workflows/temporary-canonical-main-finalizer-20260909.yml
          rm -f toolchain/codex_wire_audit/compatibility_views.py

      - name: Enforce one direct contract and no compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          package = Path('toolchain/codex_wire_audit')
          forbidden_files = [
              package / 'compatibility_views.py',
              Path('.github/direct-contract-migration-v2.py'),
              Path('.github/canonical_bootstrap_v2.py'),
              Path('.github/workflows/review-canonical-source.yml'),
              Path('.github/workflows/canonical-representation-v2.yml'),
              Path('.github/workflows/temporary-canonical-main-finalizer-20260909.yml'),
          ]
          forbidden_keys = {
              'evolution_contract', 'local_storage_schema', 'config_schema',
              'config_surface_graph', 'config_protocol',
          }
          forbidden_attrs = {'legacy_key', 'text_by_legacy_key', 'to_legacy_maps'}
          violations = [f'forbidden file remains: {path}' for path in forbidden_files if path.exists()]
          for path in sorted(package.rglob('*.py')):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module and node.module.rsplit('.', 1)[-1] == 'compatibility_views':
                      violations.append(f'{path}:{node.lineno}: compatibility import')
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.rsplit('.', 1)[-1] == 'compatibility_views':
                              violations.append(f'{path}:{node.lineno}: compatibility import')
                  elif isinstance(node, ast.Attribute) and node.attr in forbidden_attrs:
                      violations.append(f'{path}:{node.lineno}: legacy source attribute {node.attr}')
                  elif isinstance(node, ast.Constant) and isinstance(node.value, str) and node.value in forbidden_keys:
                      violations.append(f'{path}:{node.lineno}: legacy report key {node.value!r}')
          if violations:
              raise SystemExit('\n'.join(violations))
          PY
          python -m compileall -q toolchain/codex_wire_audit toolchain/tests toolchain/tools

      - name: Regenerate deterministic assets
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_v11_assets.py
          if python tools/check_canonical_contract.py --help 2>&1 | grep -q -- '--write-assets'; then
            python tools/check_canonical_contract.py --write-assets
          fi
          python tools/maintainability_metrics.py --write

      - name: Run complete source and canonical proof
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr4-no-shim-proof"
          mkdir -p "$evidence"
          make compile
          python -m pytest -q | tee "$evidence/pytest.txt"
          make check-assets | tee "$evidence/check-assets.txt"
          python tools/maintainability_metrics.py --check | tee "$evidence/maintainability.txt"
          python tools/check_canonical_contract.py --output "$evidence/canonical-contract.json"
          python -m codex_wire_audit.release_contract --output "$evidence/source-capabilities.json"
          python tools/release_pipeline.py release --output-dir "$RUNNER_TEMP/pr4-no-shim-release" | tee "$evidence/release.json"
          python tools/release_pipeline.py verify --release-dir "$RUNNER_TEMP/pr4-no-shim-release" | tee "$evidence/release-verification.json"

      - name: Validate pinned Codex integration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr4-no-shim-proof"
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output "$evidence/pinned-integration.json" \
            --schema-output "$evidence/pinned-config-schema.json" \
            --graph-output "$evidence/pinned-surface-graph.json"

      - name: Freeze and publish the exact tested PR tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-pr4-no-shim-finalizer-20260910.yml
          git add -A
          git diff --cached --check
          tested_tree="$(git write-tree)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: publish one direct canonical contract without shims'
          final_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "$tested_tree"
          git fetch --no-tags origin "refs/heads/$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$START_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          printf '{"start":"%s","commit":"%s","tree":"%s","force":false}\n' \
            "$START_SHA" "$final_sha" "$tested_tree" \
            > "$RUNNER_TEMP/pr4-no-shim-proof/publication.json"
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
          echo "TESTED_TREE=$tested_tree" >> "$GITHUB_ENV"

      - name: Merge PR 4 only if main did not move
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$START_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TESTED_TREE"
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          response="$RUNNER_TEMP/pr4-no-shim-proof/merge.json"
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$FINAL_SHA" \
            -f merge_method='squash' > "$response"
          python - "$response" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if data.get('merged') is not True:
              raise SystemExit(data.get('message', 'pull request was not merged'))
          print(json.dumps(data, sort_keys=True))
          PY

      - name: Upload durable proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4-canonical-no-shim-proof
          path: ${{ runner.temp }}/pr4-no-shim-proof
          if-no-files-found: warn
          retention-days: 30
