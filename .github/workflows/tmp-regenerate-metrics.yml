name: tmp-regenerate-metrics

on:
  push:
    branches:
      - contract/responses/feat/server-response-surface

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: contract/responses/feat/server-response-surface
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Regenerate and verify metrics
        working-directory: toolchain
        run: |
          python tools/maintainability_metrics.py --write
          python tools/maintainability_metrics.py --check
          make check-assets
          python -m pytest -q
      - name: Commit deterministic metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain/codex_wire_audit_v19_maintainability_metrics.json \
                  toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate final maintainability metrics"
          git push origin HEAD:contract/responses/feat/server-response-surface
