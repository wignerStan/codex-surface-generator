name: canonical-proof

on:
  push:
    branches: [main]
    paths:
      - "toolchain/**"
      - "contracts/**"
      - "README.md"
      - "CANONICAL_REVIEW.md"
      - ".github/workflows/canonical-proof.yml"
  pull_request:
    paths:
      - "toolchain/**"
      - "contracts/**"
      - "README.md"
      - "CANONICAL_REVIEW.md"
      - ".github/workflows/canonical-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-proof-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: toolchain

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained test dependencies
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Validate committed source and deterministic assets
        run: |
          set -euo pipefail
          make compile
          python -m pytest -q | tee "$RUNNER_TEMP/source-tests.txt"
          make check-assets
          python tools/check_canonical_contract.py
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/source-capabilities.json"
      - name: Verify proof-critical coverage
        if: matrix.python == '3.13'
        run: |
          set -euo pipefail
          coverage run --branch -m pytest -q
          coverage json -o "$RUNNER_TEMP/coverage.json"
          python tools/check_v13_coverage.py "$RUNNER_TEMP/coverage.json" --output "$RUNNER_TEMP/coverage-ratchet.json"
      - name: Ensure checks did not rewrite tracked assets
        run: git diff --exit-code
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-source-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/source-tests.txt
            ${{ runner.temp }}/source-capabilities.json
            ${{ runner.temp }}/coverage-ratchet.json
          if-no-files-found: warn
          retention-days: 14

  integration-and-release:
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained release dependencies
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Check exact pinned source and generated canonical contract
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/canonical-proof"
          codex="$RUNNER_TEMP/codex-source"
          mkdir -p "$proof"
          git init -q "$codex"
          git -C "$codex" remote add origin https://github.com/openai/codex.git
          git -C "$codex" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex" checkout -q --detach FETCH_HEAD
          test "$(git -C "$codex" rev-parse HEAD)" = "$PINNED_CODEX_SHA"
          python tools/check_config_surface.py --codex-root "$codex" --output "$proof/config-integration.json"
          python -m codex_wire_audit --json --repo-root "$codex" --coverage-profile hybrid_v19 \
            --emit-system-contract "$proof/system-contract.json" --output "$proof/report.json"
          python tools/check_canonical_contract.py --report "$proof/report.json" \
            --source-root "$codex" --output "$proof/source-byte-proof.json"
      - name: Build and independently verify reproducible wheel/sdist closure
        run: |
          set -euo pipefail
          python tools/release_pipeline.py release --output-dir "$RUNNER_TEMP/canonical-release"
          python tools/release_pipeline.py verify --release-dir "$RUNNER_TEMP/canonical-release"
          git diff --exit-code
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-proof-evidence
          path: |
            ${{ runner.temp }}/canonical-proof
            ${{ runner.temp }}/canonical-release
          if-no-files-found: warn
          retention-days: 14
