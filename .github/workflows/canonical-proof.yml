name: canonical-proof

on:
  push:
    branches:
      - main
    paths:
      - "toolchain/**"
      - ".github/canonical_bootstrap_v2.py"
      - ".github/workflows/canonical-proof.yml"
  pull_request:
    paths:
      - "toolchain/**"
      - ".github/workflows/canonical-proof.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: canonical-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Recover canonical source payload
        id: recover
        if: hashFiles('.github/canonical_bootstrap_v2.py') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/canonical_bootstrap_v2.py

      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Compile and run complete source suite
        working-directory: toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canonical-proof"
          make compile
          python -m pytest -q | tee "$RUNNER_TEMP/canonical-proof/pytest.txt"

      - name: Check deterministic assets and maintainability
        working-directory: toolchain
        run: |
          set -euo pipefail
          make check-assets | tee "$RUNNER_TEMP/canonical-proof/check-assets.txt"
          python tools/maintainability_metrics.py --check \
            | tee "$RUNNER_TEMP/canonical-proof/maintainability.txt"

      - name: Verify reproducible release closure
        working-directory: toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canonical-release"
          python -m codex_wire_audit.release_contract \
            --output "$RUNNER_TEMP/canonical-proof/source-capability-probe.json"
          python tools/release_pipeline.py release \
            --output-dir "$RUNNER_TEMP/canonical-release" \
            | tee "$RUNNER_TEMP/canonical-proof/release-summary.json"
          python tools/release_pipeline.py verify \
            --release-dir "$RUNNER_TEMP/canonical-release" \
            | tee "$RUNNER_TEMP/canonical-proof/release-verification.json"

      - name: Check architecture documentation
        run: |
          set -euo pipefail
          if test -f toolchain/tools/check_architecture_docs.py; then
            python toolchain/tools/check_architecture_docs.py \
              | tee "$RUNNER_TEMP/canonical-proof/architecture-docs.txt"
          fi

      - name: Validate pinned Codex integration
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/canonical-proof/pinned-config-surface"
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output "$RUNNER_TEMP/canonical-proof/pinned-config-surface/integration.json" \
            --schema-output "$RUNNER_TEMP/canonical-proof/pinned-config-surface/config-schema.json" \
            --graph-output "$RUNNER_TEMP/canonical-proof/pinned-config-surface/config-surface-graph.json"
          git diff --exit-code
          git status --short

      - name: Fast-forward main to proved implementation
        if: steps.recover.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.recover.outputs.base_sha }}
          HEAD_SHA: ${{ steps.recover.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor origin/main HEAD
          git push origin "HEAD:refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$HEAD_SHA"
          printf '{"base_sha":"%s","main_sha":"%s","fast_forward":true}\n' \
            "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/canonical-proof/main-fast-forward.json"

      - name: Disable superseded recovery workflows and clean temporary refs
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "canonical-proof",
          }

          def call(method: str, path: str, body=None, *, ignored=()):
              data = None if body is None else json.dumps(body).encode("utf-8")
              request = urllib.request.Request(
                  root + path, method=method, data=data, headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  if error.code in ignored:
                      return error.code, None
                  raise

          for workflow in (
              "canonical-system-contract.yml",
              "canonical-representation-v2.yml",
          ):
              encoded = urllib.parse.quote(workflow, safe="")
              call("PUT", f"/actions/workflows/{encoded}/disable", ignored=(404, 409, 422))

          branches = [
              "codex/local-storage-full-schema-20260908",
              "codex/canonical-system-contract-v1-20260909",
              "codex/canonical-system-contract-v1-20260909b",
              "codex/canonical-system-contract-v1-20260909c",
              "codex/canonical-system-contract-v1-final",
              "codex/canonical-system-contract-v1-direct",
              "codex-bootstrap-source-export-20260908",
              "codex-bootstrap-canonical-v1-20260909",
              "codex-bootstrap-canonical-v1b-20260909",
              "codex-bootstrap-canonical-v1c-20260909",
              "codex-bootstrap-canonical-final-20260909",
              "codex-bootstrap-canonical-direct-20260909",
          ]
          for branch in branches:
              ref = urllib.parse.quote(f"heads/{branch}", safe="/")
              call("DELETE", f"/git/refs/{ref}", ignored=(404, 422))

          _status, pulls = call("GET", "/pulls?state=open&per_page=100")
          for pull in pulls:
              head = pull.get("head", {}).get("ref", "")
              if head.startswith("codex/canonical-system-contract"):
                  call("PATCH", f"/pulls/{pull['number']}", {"state": "closed"})
          PY

      - name: Upload canonical proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-proof-evidence
          path: ${{ runner.temp }}/canonical-proof
          if-no-files-found: warn
          retention-days: 14
