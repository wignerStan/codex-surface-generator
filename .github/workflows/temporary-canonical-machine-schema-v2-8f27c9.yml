name: temporary-canonical-machine-schema-v2-8f27c9

on:
  push:
    branches:
      - codex/canonical-machine-schema-v1-8f27c9

permissions:
  contents: write
  actions: read

concurrency:
  group: temporary-canonical-machine-schema-v2-8f27c9
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out one-use publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Preserve publisher programs outside the worktree
        run: |
          cp .github/canonical_machine_schema_publisher.py "$RUNNER_TEMP/publisher.py"
          cp .github/canonical_machine_schema_publisher_v2.py "$RUNNER_TEMP/publisher_v2.py"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Anchor candidate directly to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          git checkout -B canonical-machine-schema-candidate-v2 "$base_sha"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - name: Materialize canonical contract and namespace-safe source parts
        env:
          BASE_PUBLISHER: ${{ runner.temp }}/publisher.py
        run: python "$RUNNER_TEMP/publisher_v2.py" | tee "$RUNNER_TEMP/publisher-v2.json"

      - name: Install constrained test environment
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Run canonical and repository acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-v2-evidence"
          mkdir -p "$evidence"
          python toolchain/tools/check_canonical_contract.py --output "$evidence/contract-validation.json"
          if test -f toolchain/tools/check_architecture_docs.py; then
            python toolchain/tools/check_architecture_docs.py | tee "$evidence/architecture-docs.txt"
          fi
          (
            cd toolchain
            make compile | tee "$evidence/compile.txt"
            python -m pytest -q | tee "$evidence/pytest.txt"
            make check-assets | tee "$evidence/check-assets.txt"
            python tools/maintainability_metrics.py --check | tee "$evidence/maintainability.txt"
            python -m codex_wire_audit.release_contract --output "$evidence/source-capability-probe.json"
          )

      - name: Exercise direct fragment discovery safety
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import importlib
          import json
          from pathlib import Path

          root = Path.cwd()
          package = root / "toolchain" / "codex_wire_audit" / "extractors"
          fragments = sorted(package.glob("_local_storage_part_*.py"))
          for fragment in fragments:
              module = importlib.import_module(
                  "codex_wire_audit.extractors." + fragment.stem
              )
              leaked = [name for name in vars(module) if name.startswith("extract_")]
              if leaked:
                  raise SystemExit(f"direct fragment import leaked extractors: {fragment}: {leaked}")
          print(json.dumps({"fragment_count": len(fragments), "direct_import_safe": True}))
          PY

      - name: Validate immutable upstream integration
        shell: bash
        env:
          PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-v2-evidence"
          if test -f toolchain/tools/check_config_surface.py; then
            codex_root="$RUNNER_TEMP/codex-source-v2"
            git init -q "$codex_root"
            git -C "$codex_root" remote add origin https://github.com/openai/codex.git
            git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
            git -C "$codex_root" checkout -q --detach FETCH_HEAD
            mkdir -p "$evidence/pinned-config-surface"
            python toolchain/tools/check_config_surface.py \
              --codex-root "$codex_root" \
              --output "$evidence/pinned-config-surface/integration.json" \
              --schema-output "$evidence/pinned-config-surface/config-schema.json" \
              --graph-output "$evidence/pinned-config-surface/config-surface-graph.json"
          fi

      - name: Commit one clean descendant and publish without force
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-v2-evidence"
          git diff --check
          git add -A
          git diff --cached --check
          git diff --cached --no-ext-diff --binary > "$RUNNER_TEMP/canonical-v2.patch"
          if grep -E 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' "$RUNNER_TEMP/canonical-v2.patch"; then
            echo 'secret-like material found in candidate patch' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            status='already-published'
            candidate_sha="$BASE_SHA"
          else
            git config user.name 'Jacob'
            git config user.email '240170694+wignerStan@users.noreply.github.com'
            git commit -m 'feat: publish canonical machine-readable system contract' \
              -m 'Establish codex-system-contract/v1 as the semantic authority, bind derived compatibility views to canonical digests, validate references and evidence, split the oversized local-storage source without changing namespace semantics, and replace bootstrap recovery with a permanent read-only proof.'
            candidate_sha="$(git rev-parse HEAD)"
            test "$(git rev-parse HEAD^)" = "$BASE_SHA"
            git push origin "HEAD:refs/heads/codex/canonical-machine-schema-candidate-v2-8f27c9"
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            current_main="$(git rev-parse refs/remotes/origin/main)"
            test "$current_main" = "$BASE_SHA" || {
              echo "main moved: expected $BASE_SHA, found $current_main" >&2
              exit 1
            }
            test "$(git rev-parse HEAD^)" = "$current_main"
            git push origin HEAD:refs/heads/main
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            test "$(git rev-parse refs/remotes/origin/main)" = "$candidate_sha"
            status='published'
          fi
          python - "$status" "$BASE_SHA" "$candidate_sha" > "$evidence/publication-result.json" <<'PY'
          import json
          import sys
          print(json.dumps({
              "status": sys.argv[1],
              "strategy": "guarded-fast-forward",
              "force": False,
              "base_sha": sys.argv[2],
              "candidate_sha": sys.argv[3],
              "schema": "codex-system-contract/v1",
              "namespace_fragments": "guarded-v2",
          }, indent=2, sort_keys=True))
          PY

      - name: Upload v2 publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-machine-schema-v2-evidence
          path: ${{ runner.temp }}/canonical-v2-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Remove one-use refs after verified publication
        if: success()
        run: |
          git push origin --delete codex/canonical-machine-schema-candidate-v2-8f27c9 || true
          git push origin --delete codex/canonical-machine-schema-candidate-8f27c9 || true
          git push origin --delete "$GITHUB_REF_NAME" || true
