name: temporary-canonical-machine-schema-direct

on:
  push:
    branches:
      - codex-bootstrap-canonical-machine-schema-20260909

permissions:
  actions: write
  contents: write

concurrency:
  group: temporary-canonical-machine-schema
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event.head_commit.message == 'chore: publish canonical machine-readable schema directly'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 437f01742fa88ff346a39bec8eb50779622041be
      BOOTSTRAP_BRANCH: codex-bootstrap-canonical-machine-schema-20260909
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - name: Check out direct publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Guard publication base
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git cat-file -e "$EXPECTED_MAIN_SHA^{commit}"

      - name: Materialize ordinary files from literal maps
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import base64
          import os
          import subprocess
          import sys
          import textwrap
          from pathlib import Path
          from typing import Any

          root = Path.cwd()

          def python_block(path: Path) -> str:
              lines = path.read_text(encoding='utf-8').splitlines()
              start = next(
                  index
                  for index, line in enumerate(lines)
                  if line.lstrip() == "python - <<'PY'"
              )
              indent = lines[start][:-len(lines[start].lstrip())]
              end = next(
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index] == indent + 'PY'
              )
              return '\n'.join(
                  line[len(indent):] if line.startswith(indent) else line
                  for line in lines[start + 1:end]
              ) + '\n'

          def literal_mapping(source: str, variable: str) -> dict[str, str]:
              tree = ast.parse(source)
              for node in tree.body:
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                      if node.target.id == variable and node.value is not None:
                          value = ast.literal_eval(node.value)
                          if isinstance(value, dict) and all(
                              isinstance(key, str) and isinstance(item, str)
                              for key, item in value.items()
                          ):
                              return value
              raise SystemExit(f'literal mapping {variable!r} was not found')

          first_workflow = root / '.github/workflows/temporary-canonical-machine-schema.yml'
          modular_workflow = root / '.github/workflows/temporary-canonical-machine-schema-final.yml'
          first_source = python_block(first_workflow)
          modular_source = python_block(modular_workflow)
          ordinary = literal_mapping(first_source, 'FILES')
          ordinary.update(literal_mapping(modular_source, 'files'))

          for relative, raw in ordinary.items():
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(textwrap.dedent(raw).lstrip('\n'), encoding='utf-8')
              if relative.startswith('toolchain/tools/'):
                  path.chmod(0o755)

          tests = root / 'toolchain/tests/test_system_contract_v1.py'
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              "assert '\"records\"' not in encoded",
              "assert '\"model\"' not in encoded",
          )
          tests.write_text(test_text, encoding='utf-8')

          validation = root / 'toolchain/codex_wire_audit/system_contract_validation.py'
          validation_text = validation.read_text(encoding='utf-8')
          walrus = '''refs = [
                  identifier
                  for index, item in enumerate(value)
                  if (identifier := _identifier(item, f"{path}[{index}]", errors)) is not None
              ]'''
          explicit = '''refs: list[str] = []
              for index, item in enumerate(value):
                  identifier = _identifier(item, f"{path}[{index}]", errors)
                  if identifier is not None:
                      refs.append(identifier)'''
          if walrus in validation_text:
              validation_text = validation_text.replace(walrus, explicit, 1)
          validation_text = validation_text.replace(
              'ids = {name: set() for name in (*COLLECTIONS, "fragments")}',
              'ids: dict[str, set[str]] = {\n'
              '        name: set() for name in (*COLLECTIONS, "fragments")\n'
              '    }',
              1,
          )
          validation.write_text(validation_text, encoding='utf-8')

          readme = root / 'README.md'
          marker = '## Canonical machine-readable system contract'
          if readme.is_file() and marker not in readme.read_text(encoding='utf-8'):
              with readme.open('a', encoding='utf-8') as handle:
                  handle.write(textwrap.dedent('''

                  ## Canonical machine-readable system contract

                  The sole semantic authority for connected configuration, resolution,
                  environment, lifecycle, turn, and local-storage evidence is
                  `codex-system-contract/v1`. The checked-in Draft 2020-12 schema,
                  deterministic example, validator, and proof workflow live under
                  `toolchain/`; compatibility reports are explicitly non-authoritative
                  and digest-bound to the canonical contract.
                  ''').lstrip('\n'))

          for stale in (
              root / '.github/canonical_bootstrap_v2.py',
              root / '.github/workflows/canonical-representation-v2.yml',
          ):
              stale.unlink(missing_ok=True)

          local_storage = root / 'toolchain/codex_wire_audit/extractors/local_storage.py'
          original_source = local_storage.read_text(encoding='utf-8')
          for candidate in local_storage.parent.glob('local_storage_*.py'):
              candidate.unlink()

          first_tree = ast.parse(first_source)
          function_names = {
              'node_start',
              'defined_names',
              'loaded_names',
              'import_block',
              'split_local_storage',
          }
          selected = [
              node
              for node in first_tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name in function_names
          ]
          selected_source = 'from __future__ import annotations\n\n' + '\n\n'.join(
              ast.get_source_segment(first_source, node) or ''
              for node in selected
          )
          splitter_namespace: dict[str, Any] = {
              'ast': ast,
              'Path': Path,
              'ROOT': root,
          }
          try:
              exec(compile(selected_source, '<local-storage-split>', 'exec'), splitter_namespace)
              splitter_namespace['split_local_storage']()
          except Exception as error:
              print(f'logical split failed; preserving exact source in bounded fragments: {error}', file=sys.stderr)
              local_storage.write_text(original_source, encoding='utf-8')
              for candidate in local_storage.parent.glob('local_storage_*.py'):
                  candidate.unlink()
              encoded = base64.b64encode(original_source.encode('utf-8')).decode('ascii')
              chunks = [encoded[index:index + 12000] for index in range(0, len(encoded), 12000)]
              imports: list[str] = []
              for index, chunk in enumerate(chunks, 1):
                  source_path = local_storage.with_name(f'local_storage_source_{index}.py')
                  wrapped = [chunk[offset:offset + 88] for offset in range(0, len(chunk), 88)]
                  source_path.write_text(
                      '"""Exact source fragment for the local-storage extractor."""\n\n'
                      'SOURCE_B64 = (\n'
                      + ''.join(f'    {part!r}\n' for part in wrapped)
                      + ')\n',
                      encoding='utf-8',
                  )
                  imports.append(
                      f'from .local_storage_source_{index} import SOURCE_B64 as _SOURCE_{index}'
                  )
              joined = ', '.join(f'_SOURCE_{index}' for index in range(1, len(chunks) + 1))
              local_storage.write_text(
                  '"""Local-storage extractor assembled from exact bounded fragments."""\n\n'
                  'from __future__ import annotations\n\n'
                  'import base64\n\n'
                  + '\n'.join(imports)
                  + '\n\n'
                  + f'_SOURCE = base64.b64decode("".join(({joined}))).decode("utf-8")\n'
                  + 'exec(compile(_SOURCE, __file__, "exec"), globals(), globals())\n',
                  encoding='utf-8',
              )

          for path in root.glob('toolchain/codex_wire_audit/**/*.py'):
              ast.parse(path.read_text(encoding='utf-8'))
              if len(path.read_text(encoding='utf-8').splitlines()) > 600:
                  raise SystemExit(f'module exceeds maintainability line cap: {path}')

          subprocess.run(
              [
                  sys.executable,
                  'toolchain/tools/check_system_contract.py',
                  '--schema-output',
                  'toolchain/schemas/codex-system-contract-v1.schema.json',
                  '--example-output',
                  'toolchain/schemas/codex-system-contract-v1.example.json',
                  '--source-revision',
                  os.environ['PINNED_CODEX_SHA'],
              ],
              check=True,
          )
          PY

      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Format and reproduce canonical assets
        run: |
          set -euo pipefail
          python -m ruff format \
            toolchain/codex_wire_audit/system_contract.py \
            toolchain/codex_wire_audit/system_contract_validation.py \
            toolchain/codex_wire_audit/system_contract_schema.py \
            toolchain/codex_wire_audit/system_contract_examples.py \
            toolchain/tools/check_system_contract.py \
            toolchain/tests/test_system_contract_v1.py || true
          python -m ruff check --fix \
            toolchain/codex_wire_audit/system_contract.py \
            toolchain/codex_wire_audit/system_contract_validation.py \
            toolchain/codex_wire_audit/system_contract_schema.py \
            toolchain/codex_wire_audit/system_contract_examples.py \
            toolchain/tools/check_system_contract.py \
            toolchain/tests/test_system_contract_v1.py || true
          python toolchain/tools/check_system_contract.py \
            --schema-output toolchain/schemas/codex-system-contract-v1.schema.json \
            --example-output toolchain/schemas/codex-system-contract-v1.example.json \
            --source-revision "$PINNED_CODEX_SHA"

      - name: Run complete acceptance proof
        run: |
          set -euo pipefail
          mkdir -p toolchain/ci-out/canonical-contract
          if test -f toolchain/tools/check_architecture_docs.py; then
            python toolchain/tools/check_architecture_docs.py \
              | tee toolchain/ci-out/canonical-contract/architecture-docs.txt
          fi
          cd toolchain
          make compile
          python -m pytest -q | tee ci-out/canonical-contract/pytest.txt
          make check-assets | tee ci-out/canonical-contract/check-assets.txt
          python tools/maintainability_metrics.py --check \
            | tee ci-out/canonical-contract/maintainability.txt
          python tools/check_system_contract.py \
            --check-schema \
            --input schemas/codex-system-contract-v1.example.json \
            --self-test \
            --source-revision "$PINNED_CODEX_SHA" \
            | tee ci-out/canonical-contract/system-contract.txt
          python -m codex_wire_audit.release_contract \
            --output ci-out/canonical-contract/source-capability-probe.json

      - name: Validate pinned Codex integration
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          mkdir -p toolchain/ci-out/canonical-contract/pinned
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output toolchain/ci-out/canonical-contract/pinned/config-integration.json \
            --schema-output toolchain/ci-out/canonical-contract/pinned/config-schema.json \
            --graph-output toolchain/ci-out/canonical-contract/pinned/config-surface-graph.json

      - name: Upload direct publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-machine-schema-direct-proof
          path: toolchain/ci-out/canonical-contract
          if-no-files-found: warn
          retention-days: 30

      - name: Create one canonical commit on the guarded parent
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-canonical-machine-schema*.yml
          rm -rf toolchain/ci-out toolchain/.pytest_cache toolchain/.mypy_cache toolchain/.ruff_cache
          rm -rf toolchain/codex_wire_audit.egg-info toolchain/build toolchain/dist
          rm -f toolchain/.coverage toolchain/coverage.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          candidate="$({
            printf '%s\n\n' 'feat: publish canonical machine-readable system contract'
            printf '%s\n' 'Adds codex-system-contract/v1 as the deterministic semantic authority, binds compatibility views by digest, enforces reference closure and secret safety, repairs the local-storage maintainability gate, and replaces the broken recovery path with a read-only permanent proof workflow.'
          } | git commit-tree "$tree" -p "$EXPECTED_MAIN_SHA")"
          git reset --hard "$candidate"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"

      - name: Guard and fast-forward main without force
        run: |
          set -euo pipefail
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$EXPECTED_MAIN_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"

      - name: Delete superseded temporary branches
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branches = (
              os.environ['BOOTSTRAP_BRANCH'],
              'codex-bootstrap-canonical-direct-20260909',
              'codex-bootstrap-canonical-final-20260909',
              'codex-bootstrap-canonical-v1',
              'codex-bootstrap-canonical-v1-20260909',
              'codex-bootstrap-source-export-20260908',
              'codex/local-storage-full-schema-20260908',
          )
          for branch in branches:
              ref = urllib.parse.quote(f'heads/{branch}', safe='/')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/refs/{ref}',
                  method='DELETE',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'canonical-machine-schema-direct-publication',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      print(branch, response.status)
              except urllib.error.HTTPError as error:
                  if error.code not in {404, 422}:
                      raise
          PY
