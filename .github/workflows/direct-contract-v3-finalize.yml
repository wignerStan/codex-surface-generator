name: direct-contract-v3-finalize

on:
  push:
    branches:
      - review/canonical-contract-20260909
    paths:
      - .github/workflows/direct-contract-v3-finalize.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: direct-contract-v3-finalize
  cancel-in-progress: false

jobs:
  prove-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MAIN_SHA: 3162092be72905b1bf1b29a8f0e5a88619493ef0
      REVIEW_BRANCH: review/canonical-contract-20260909
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify unchanged reviewed main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$REVIEW_BRANCH"
          git merge-base --is-ancestor "$MAIN_SHA" HEAD
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          echo "OLD_MAIN_TREE=$(git rev-parse "$MAIN_SHA^{tree}")" >> "$GITHUB_ENV"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Install constrained dependencies
        run: python -m pip install --constraint toolchain/ci/constraints.txt -e './toolchain[test]'

      - name: Materialize final direct-only source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/direct-v3-proof"
          python .github/direct-contract-migration-v3.py \
            | tee "$RUNNER_TEMP/direct-v3-proof/migration.json"

      - name: Regenerate and normalize deterministic assets
        working-directory: toolchain
        run: |
          set -euo pipefail
          python tools/build_v11_assets.py
          python tools/check_canonical_contract.py --write-assets
          python tools/maintainability_metrics.py --write
          cd ..
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('.github/direct-contract-migration-v3.py')
          spec = importlib.util.spec_from_file_location('direct_v3', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.update_json_assets()
          module.static_validation()
          PY

      - name: Remove all temporary publication machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/direct-contract-migration.py \
            .github/direct-contract-migration-v2.py \
            .github/direct-contract-migration-v3.py \
            .github/workflows/direct-contract-migration.yml \
            .github/workflows/direct-contract-finalize.yml \
            .github/workflows/direct-contract-v3-finalize.yml \
            .github/workflows/review-canonical-source.yml \
            .github/workflows/temporary-canonical-main-finalizer-20260909.yml \
            .github/canonical_bootstrap_v2.py

      - name: Enforce the singular representation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e toolchain/codex_wire_audit/compatibility_views.py
          ! grep -R -n -E 'compatibility_views|apply_config_surface_overlay|apply_local_storage_overlay' \
            toolchain/codex_wire_audit toolchain/tools toolchain/tests contracts \
            .github/workflows/canonical-proof.yml README.md CANONICAL_REVIEW.md
          python - <<'PY' | tee "$RUNNER_TEMP/direct-v3-proof/static-shape.json"
          import json
          from pathlib import Path
          fixture = json.loads(Path('contracts/codex-system-contract/v1/example.fixture.json').read_text())
          schema = json.loads(Path('toolchain/codex_wire_audit_v11_schemas/system-contract.schema.json').read_text())
          assert set(fixture) == {'$schema', 'schema', 'authority', 'model', 'integrity'}
          assert 'compatibility_views' not in fixture
          assert 'compatibility_views' not in json.dumps(schema, sort_keys=True)
          print(json.dumps({'single_representation': True, 'keys': sorted(fixture)}, sort_keys=True))
          PY

      - name: Stage the exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          echo "TESTED_TREE=$(git write-tree)" >> "$GITHUB_ENV"
          git diff --cached --stat | tee "$RUNNER_TEMP/direct-v3-proof/candidate-stat.txt"

      - name: Compile and execute complete tests
        working-directory: toolchain
        run: |
          set -euo pipefail
          make compile
          python -m pytest -q | tee "$RUNNER_TEMP/direct-v3-proof/pytest.txt"

      - name: Verify deterministic assets and maintainability
        working-directory: toolchain
        run: |
          set -euo pipefail
          make check-assets | tee "$RUNNER_TEMP/direct-v3-proof/assets.txt"
          python tools/maintainability_metrics.py --check \
            | tee "$RUNNER_TEMP/direct-v3-proof/maintainability.txt"
          python tools/check_canonical_contract.py \
            --output "$RUNNER_TEMP/direct-v3-proof/fixture-contract.json"
          python -m codex_wire_audit.release_contract \
            --output "$RUNNER_TEMP/direct-v3-proof/source-capabilities.json"

      - name: Verify proof-critical coverage
        working-directory: toolchain
        run: |
          set -euo pipefail
          coverage erase
          coverage run --branch -m pytest -q
          coverage json -o "$RUNNER_TEMP/direct-v3-proof/coverage.json"
          python tools/check_v13_coverage.py \
            "$RUNNER_TEMP/direct-v3-proof/coverage.json" \
            --output "$RUNNER_TEMP/direct-v3-proof/coverage-ratchet.json"

      - name: Validate pinned Codex integration and source bytes
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/direct-v3-proof/pinned"
          codex="$RUNNER_TEMP/codex-source"
          mkdir -p "$proof"
          git init -q "$codex"
          git -C "$codex" remote add origin https://github.com/openai/codex.git
          git -C "$codex" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex" checkout -q --detach FETCH_HEAD
          test "$(git -C "$codex" rev-parse HEAD)" = "$PINNED_CODEX_SHA"
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex" --output "$proof/config-integration.json"
          python -m codex_wire_audit --json \
            --repo-root "$codex" --coverage-profile hybrid_v19 \
            --emit-system-contract "$proof/system-contract.json" \
            --output "$proof/report.json"
          python toolchain/tools/check_canonical_contract.py \
            --report "$proof/report.json" --source-root "$codex" \
            --output "$proof/source-byte-proof.json"
          python - "$proof/report.json" "$proof/system-contract.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text())
          standalone = json.loads(Path(sys.argv[2]).read_text())
          forbidden = {'config_schema', 'config_surface_graph', 'evolution_contract', 'local_storage_schema'}
          assert not (forbidden & set(report)), forbidden & set(report)
          assert report['system_contract'] == standalone
          assert set(standalone) == {'$schema', 'schema', 'authority', 'model', 'integrity'}
          assert 'compatibility_views' not in standalone
          PY

      - name: Build and independently verify release closure
        working-directory: toolchain
        run: |
          set -euo pipefail
          python tools/release_pipeline.py release \
            --output-dir "$RUNNER_TEMP/direct-v3-release" \
            | tee "$RUNNER_TEMP/direct-v3-proof/release.json"
          python tools/release_pipeline.py verify \
            --release-dir "$RUNNER_TEMP/direct-v3-release" \
            | tee "$RUNNER_TEMP/direct-v3-proof/release-verification.json"

      - name: Publish one clean commit directly atop main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = "$TESTED_TREE"
          git diff --cached --check
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message="$RUNNER_TEMP/direct-v3-message.txt"
          cat > "$message" <<'EOF'
          fix: establish one direct canonical system contract

          Remove the installed adapter and every parallel report path. Seal the
          source-derived extractor model once under codex-system-contract/v1,
          strengthen required-source and source-byte validation, fix strict
          decoding of line-wrapped GitHub content, preserve maintainable module
          boundaries, and keep permanent proof read-only.
          EOF
          final_sha="$(git commit-tree "$TESTED_TREE" -p "$MAIN_SHA" < "$message")"
          test "$(git rev-parse "$final_sha^{tree}")" = "$TESTED_TREE"
          test "$(git rev-parse "$final_sha^")" = "$MAIN_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          git push origin "$final_sha:refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$final_sha"
          echo "PUBLISHED_SHA=$final_sha" >> "$GITHUB_ENV"
          printf '{"status":"published-to-main","commit":"%s","tree":"%s","parent":"%s","force":false}\n' \
            "$final_sha" "$TESTED_TREE" "$MAIN_SHA" \
            > "$RUNNER_TEMP/direct-v3-proof/publication.json"

      - name: Wait for required post-publication workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$RUNNER_TEMP/direct-v3-proof/post-publication.json"
          from __future__ import annotations
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['PUBLISHED_SHA']
          token = os.environ['GH_TOKEN']
          required = {'.github/workflows/canonical-proof.yml', '.github/workflows/config-surface.yml'}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'direct-contract-v3-finalize',
          }
          deadline = time.monotonic() + 4200
          last = {}
          while time.monotonic() < deadline:
              query = urllib.parse.urlencode({'head_sha': sha, 'per_page': 100})
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/actions/runs?{query}', headers=headers
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  runs = json.load(response)['workflow_runs']
              last = {
                  run['path']: {
                      'id': run['id'], 'status': run['status'],
                      'conclusion': run['conclusion'], 'url': run['html_url'],
                  }
                  for run in runs if run['path'] in required
              }
              if required <= set(last) and all(item['status'] == 'completed' for item in last.values()):
                  bad = {path: item for path, item in last.items() if item['conclusion'] not in {'success', 'neutral', 'skipped'}}
                  if bad:
                      raise SystemExit('post-publication workflow failure: ' + json.dumps(bad, sort_keys=True))
                  print(json.dumps({'commit': sha, 'workflows': last}, indent=2, sort_keys=True))
                  break
              time.sleep(20)
          else:
              raise SystemExit('timed out waiting for post-publication workflows: ' + json.dumps(last, sort_keys=True))
          PY

      - name: Record landing, close draft PR, and remove staging branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body="Direct-only canonical representation landed on \`main\` at \`$PUBLISHED_SHA\` as one clean commit directly atop \`$MAIN_SHA\`. The identical tree passed the complete pre-publication proof and both required post-publication workflows. No force update was used; no temporary publisher or installed adapter exists in the final tree."
          gh api "repos/$GITHUB_REPOSITORY/issues/4/comments" --method POST --field body="$body"
          gh api "repos/$GITHUB_REPOSITORY/pulls/4" --method PATCH --field state=closed >/dev/null
          git push origin --delete "$REVIEW_BRANCH" || true

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-contract-v3-proof
          path: |
            ${{ runner.temp }}/direct-v3-proof
            ${{ runner.temp }}/direct-v3-release
          if-no-files-found: warn
          retention-days: 30

      - name: Forward-revert main after a failed post-publication proof
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if test -z "${PUBLISHED_SHA:-}"; then
            exit 0
          fi
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$PUBLISHED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          revert_sha="$(printf '%s\n' 'revert: restore main after failed canonical publication proof' | git commit-tree "$OLD_MAIN_TREE" -p "$PUBLISHED_SHA")"
          git push origin "$revert_sha:refs/heads/main"

      - name: Remove v3 staging after pre-publication failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${PUBLISHED_SHA:-}"; then
            exit 0
          fi
          git reset --hard "$GITHUB_SHA"
          rm -f .github/direct-contract-migration-v3.py .github/workflows/direct-contract-v3-finalize.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove failed v3 finalizer staging'
          git fetch --no-tags origin "refs/heads/$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
