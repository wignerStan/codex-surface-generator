name: responses-contract-refresh

on:
  push:
    branches: [ci/responses-transport-refresh]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/responses-transport-refresh
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply Responses transport contract update
        run: |
          set -euo pipefail
          cp .github/scripts/responses_refresh.py /tmp/responses_refresh.py
          git fetch origin main
          git checkout -B contract/responses/fix/websocket-http-fallback origin/main
          python /tmp/responses_refresh.py
          python - <<'PY'
          from pathlib import Path
          path = Path('toolchain/tests/test_responses_protocol_extractor.py')
          text = path.read_text()
          old = 'fn run_websocket_response_stream() { previous_response_not_found; websocket_connection_limit_reached; ResponsesStreamEvent; }\n'
          new = old + 'fn terminal_socket_teardown() { let failed_stream = guard.take(); self.pump_task.abort(); }\n'
          if text.count(old) != 1:
              raise SystemExit('websocket fixture teardown anchor drift')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate full source tree
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python - <<'PY'
          from tests.test_responses_protocol_extractor import _snapshot
          from codex_wire_audit.diagnostics import DiagnosticCollector
          from codex_wire_audit.extractors.responses_protocol import ResponsesRequestExtractor
          diagnostics = DiagnosticCollector()
          result = ResponsesRequestExtractor().extract(_snapshot(), diagnostics)
          print('fixture semantic_complete =', result.semantic_complete)
          for item in diagnostics.values():
              print(item.code, item.message, item.details)
          PY
          python -m pytest -q tests/test_responses_protocol_extractor.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          make check-assets
          python tools/check_canonical_contract.py
      - name: Commit exact topic
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "codex-contract-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(responses): model websocket HTTP fallback lifecycle"
          git push --force-with-lease origin HEAD:contract/responses/fix/websocket-http-fallback
