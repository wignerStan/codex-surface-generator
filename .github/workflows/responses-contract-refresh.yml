name: responses-contract-refresh

on:
  push:
    branches: [ci/responses-transport-refresh]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/responses-transport-refresh
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply Responses transport contract update
        run: |
          set -euo pipefail
          cp .github/scripts/responses_refresh.py /tmp/responses_refresh.py
          git fetch origin main
          git checkout -B contract/responses/fix/websocket-http-fallback origin/main
          python /tmp/responses_refresh.py
          python - <<'PY'
          from pathlib import Path

          # Keep the test fixtures as exact source-shape probes.
          path = Path('toolchain/tests/test_responses_protocol_extractor.py')
          text = path.read_text()
          old = 'fn run_websocket_response_stream() { previous_response_not_found; websocket_connection_limit_reached; ResponsesStreamEvent; }\n'
          new = old + 'fn terminal_socket_teardown() { let failed_stream = guard.take(); self.pump_task.abort(); }\n'
          if text.count(old) != 1:
              raise SystemExit('websocket fixture teardown anchor drift')
          text = text.replace(old, new, 1)
          old2 = 'enum WebsocketStreamOutcome { Stream, FallbackToHttp }\n'
          new2 = old2 + 'fn use_fallback_outcome() { WebsocketStreamOutcome::FallbackToHttp; }\n'
          if text.count(old2) != 1:
              raise SystemExit('websocket fallback outcome fixture anchor drift')
          path.write_text(text.replace(old2, new2, 1))

          # Keep the extractor concise: static transport projection belongs in a pure support module.
          support = Path('toolchain/codex_wire_audit/extractors/responses_transport.py')
          support.write_text('''"""Pure Responses transport lifecycle projections."""\n\nfrom __future__ import annotations\n\nfrom typing import Any\n\n\ndef build_endpoint_mapping() -> dict[str, Any]:\n    return {\n        "responses_path": "/responses",\n        "http": {"request": "POST /responses", "response_stream": "text/event-stream (SSE)"},\n        "websocket": {\n            "request": "WebSocket HTTP Upgrade followed by response.create frames",\n            "same_responses_path": True,\n        },\n        "provider_scheme_map": {\n            "http": "ws",\n            "https": "wss",\n            "ws": "ws",\n            "wss": "wss",\n            "other": "unchanged",\n        },\n    }\n\n\ndef build_startup_prewarm() -> dict[str, Any]:\n    return {\n        "activation": "only when responses_websocket_enabled()",\n        "scheduling": "session startup before the first user submit",\n        "base_instructions": "current prompt base instructions",\n        "logical_conversation_input": "empty before first user input",\n        "request_type": "response.create",\n        "generate": False,\n        "waits_for": "response.completed",\n        "purpose": "prime a reusable WebSocket connection and previous_response_id continuation baseline",\n        "standard_mode": "static top-level instructions and model-visible tools remain on the prewarm request",\n        "responses_lite_mode": "tools and base instructions are developer-visible input prefix items; no user item is present",\n        "resumed_session": "startup prewarm is scheduled before initial history handling; the first real delta may therefore include restored history plus the new user item",\n    }\n\n\ndef build_continuation() -> dict[str, Any]:\n    return {\n        "requires_compatible_non_input_properties": True,\n        "compatibility_function": "responses_request_properties_match",\n        "previous_response_id": "reuses the last completed response only when the current logical input extends the prior request plus server-returned items",\n        "input_on_reuse": "incremental suffix only",\n        "terminally_failed_socket_reused": False,\n    }\n\n\ndef build_fallback_policy() -> dict[str, Any]:\n    return {\n        "preferred_transport": "Responses WebSocket when enabled and session fallback is inactive",\n        "fallback_transport": "HTTP Responses transport (HTTPS for the normal https:// OpenAI provider; plain HTTP remains possible for custom http:// providers)",\n        "upgrade_required_426": "immediate WebSocket-to-HTTP fallback before normal retry-budget exhaustion",\n        "retryable_websocket_error": "discard failed socket, then retry on a newly connected WebSocket while retry budget remains",\n        "after_retry_budget_exhaustion": "activate session-scoped HTTP fallback and retry the same logical request over HTTP",\n        "session_sticky": True,\n        "normal_retry_counter_reset_after_fallback": True,\n        "user_warning_literal": "Falling back from WebSockets to HTTPS transport. {err:#}",\n        "warning_scope": "literal user-facing wording; machine transport semantics remain HTTP so custom http:// providers are represented accurately",\n        "unbounded_connection_retry": {\n            "feature": "UnboundedConnectionRetries",\n            "conditions": [\n                "sampling request",\n                "ConnectionFailed",\n                "non-internal session",\n                "provider is not Amazon Bedrock",\n            ],\n            "delay": "5 seconds exponential backoff capped at 60 seconds",\n            "fallback_preempted": True,\n        },\n        "nonretryable_error": "surface the error; terminal socket teardown alone does not imply transport fallback",\n    }\n\n\ndef build_terminal_socket_policy() -> dict[str, Any]:\n    return {\n        "terminal_stream_error_discards_connection": True,\n        "graceful_close_wait": False,\n        "drop_action": "WsStream::drop aborts the pump task",\n        "retry_uses_new_websocket": True,\n        "recognized_retryable_wrapped_codes": [\n            "websocket_connection_limit_reached",\n            "previous_response_not_found",\n        ],\n        "ping": "reply Pong and continue",\n        "pong": "ignore and continue",\n    }\n''')

          protocol = Path('toolchain/codex_wire_audit/extractors/responses_protocol.py')
          source = protocol.read_text()
          import_anchor = 'from .registry import ExtractorResult, register_extractor\n'
          transport_import = '''from .responses_transport import (\n    build_continuation,\n    build_endpoint_mapping,\n    build_fallback_policy,\n    build_startup_prewarm,\n    build_terminal_socket_policy,\n)\n'''
          if source.count(import_anchor) != 1:
              raise SystemExit('responses transport import anchor drift')
          source = source.replace(import_anchor, import_anchor + transport_import, 1)
          start = source.index('            "endpoint_mapping": {')
          end = source.index('            "evidence": {', start)
          compact = '''            "endpoint_mapping": build_endpoint_mapping(),\n            "startup_prewarm": build_startup_prewarm(),\n            "continuation": build_continuation(),\n            "fallback_policy": build_fallback_policy(),\n            "terminal_socket_policy": build_terminal_socket_policy(),\n'''
          protocol.write_text(source[:start] + compact + source[end:])
          PY
      - name: Validate full source tree
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python -m pytest -q tests/test_responses_protocol_extractor.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          make check-assets
          python tools/check_canonical_contract.py
      - name: Commit exact topic
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "codex-contract-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(responses): model websocket HTTP fallback lifecycle"
          git push --force-with-lease origin HEAD:contract/responses/fix/websocket-http-fallback
