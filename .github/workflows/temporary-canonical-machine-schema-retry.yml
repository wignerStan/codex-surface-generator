name: temporary-canonical-machine-schema-retry

on:
  push:
    branches:
      - codex-canonical-machine-schema-retry-20260909

permissions:
  actions: write
  contents: write

concurrency:
  group: canonical-machine-schema-retry
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event.head_commit.message == 'chore: retry canonical machine schema publication'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_MAIN_SHA: 437f01742fa88ff346a39bec8eb50779622041be
      SOURCE_BRANCH: codex-bootstrap-canonical-machine-schema-20260909
      PUBLICATION_BRANCH: codex-canonical-machine-schema-direct-20260909
      RETRY_BRANCH: codex-canonical-machine-schema-retry-20260909
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - name: Check out isolated retry branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Revalidate main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current="$(git rev-parse origin/main)"
          echo "CURRENT_MAIN_SHA=$current" >> "$GITHUB_ENV"
          if test "$current" = "$EXPECTED_MAIN_SHA"; then
            echo 'PUBLISH_REQUIRED=true' >> "$GITHUB_ENV"
            exit 0
          fi
          subject="$(git log -1 --format=%s origin/main)"
          if test "$subject" = 'feat: publish canonical machine-readable system contract' \
             && git cat-file -e 'origin/main:toolchain/schemas/codex-system-contract-v1.schema.json' \
             && git cat-file -e 'origin/main:toolchain/codex_wire_audit/system_contract.py' \
             && git cat-file -e 'origin/main:.github/workflows/canonical-proof.yml' \
             && git show 'origin/main:toolchain/schemas/codex-system-contract-v1.schema.json' \
                  | grep -q 'codex-system-contract/v1'; then
            echo 'PUBLISH_REQUIRED=false' >> "$GITHUB_ENV"
            echo "Canonical representation already exists at $current"
            exit 0
          fi
          echo "main moved unexpectedly from $EXPECTED_MAIN_SHA to $current" >&2
          exit 1

      - name: Recover preserved source maps
        if: env.PUBLISH_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_ref="refs/remotes/origin/$SOURCE_BRANCH"
          git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH:$remote_ref"
          mkdir -p .github/workflows
          git show "$remote_ref:.github/workflows/temporary-canonical-machine-schema.yml" \
            > .github/workflows/temporary-canonical-machine-schema.yml
          git show "$remote_ref:.github/workflows/temporary-canonical-machine-schema-final.yml" \
            > .github/workflows/temporary-canonical-machine-schema-final.yml
          git show "$remote_ref:.github/workflows/temporary-canonical-machine-schema-direct.yml" \
            > "$RUNNER_TEMP/direct-materializer.yml"

      - name: Materialize canonical sources
        if: env.PUBLISH_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          source_path = Path(os.environ['RUNNER_TEMP']) / 'direct-materializer.yml'
          lines = source_path.read_text(encoding='utf-8').splitlines()
          start = next(
              index
              for index, line in enumerate(lines)
              if line.lstrip() == "python - <<'PY'"
          )
          indent = lines[start][:-len(lines[start].lstrip())]
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index] == indent + 'PY'
          )
          script = '\n'.join(
              line[len(indent):] if line.startswith(indent) else line
              for line in lines[start + 1:end]
          ) + '\n'
          namespace: dict[str, object] = {'__name__': '__main__'}
          exec(compile(script, str(source_path), 'exec'), namespace, namespace)
          PY
          if compgen -G 'toolchain/codex_wire_audit/extractors/local_storage_source_*.py' > /dev/null; then
            echo 'dependency-safe local-storage splitting failed; encoded fallback is not publishable' >&2
            exit 1
          fi
          test -f toolchain/codex_wire_audit/system_contract.py
          test -f toolchain/codex_wire_audit/system_contract_validation.py
          test -f toolchain/codex_wire_audit/system_contract_schema.py
          test -f toolchain/codex_wire_audit/system_contract_examples.py
          test -f toolchain/schemas/codex-system-contract-v1.schema.json
          test -f toolchain/schemas/codex-system-contract-v1.example.json
          test -f toolchain/CODEX_SYSTEM_CONTRACT_V1.md
          test -f .github/workflows/canonical-proof.yml

      - name: Install constrained dependencies with retry
        if: env.PUBLISH_REQUIRED == 'true'
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if python -m pip install --constraint ci/constraints.txt -e '.[test]'; then
              installed=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$installed" = true
          python -m pip check

      - name: Format and reproduce canonical assets
        if: env.PUBLISH_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            toolchain/codex_wire_audit/system_contract.py
            toolchain/codex_wire_audit/system_contract_validation.py
            toolchain/codex_wire_audit/system_contract_schema.py
            toolchain/codex_wire_audit/system_contract_examples.py
            toolchain/tools/check_system_contract.py
            toolchain/tests/test_system_contract_v1.py
          )
          python -m ruff check --fix "${targets[@]}" || true
          python -m ruff format "${targets[@]}"
          python toolchain/tools/check_system_contract.py \
            --schema-output toolchain/schemas/codex-system-contract-v1.schema.json \
            --example-output toolchain/schemas/codex-system-contract-v1.example.json \
            --source-revision "$PINNED_CODEX_SHA"

      - name: Run complete acceptance proof
        if: env.PUBLISH_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain/ci-out/canonical-contract
          if test -f toolchain/tools/check_architecture_docs.py; then
            python toolchain/tools/check_architecture_docs.py \
              | tee toolchain/ci-out/canonical-contract/architecture-docs.txt
          fi
          cd toolchain
          make compile
          python -m pytest -q | tee ci-out/canonical-contract/pytest.txt
          make check-assets | tee ci-out/canonical-contract/check-assets.txt
          python tools/maintainability_metrics.py --check \
            | tee ci-out/canonical-contract/maintainability.txt
          python tools/check_system_contract.py \
            --check-schema \
            --input schemas/codex-system-contract-v1.example.json \
            --self-test \
            --source-revision "$PINNED_CODEX_SHA" \
            | tee ci-out/canonical-contract/system-contract.txt
          python -m codex_wire_audit.release_contract \
            --output ci-out/canonical-contract/source-capability-probe.json
          python -m pip check | tee ci-out/canonical-contract/pip-check.txt

      - name: Validate pinned Codex integration with retry
        if: env.PUBLISH_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          fetched=false
          for attempt in 1 2 3; do
            if git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"; then
              fetched=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$fetched" = true
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          mkdir -p toolchain/ci-out/canonical-contract/pinned
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output toolchain/ci-out/canonical-contract/pinned/config-integration.json \
            --schema-output toolchain/ci-out/canonical-contract/pinned/config-schema.json \
            --graph-output toolchain/ci-out/canonical-contract/pinned/config-surface-graph.json

      - name: Upload retry evidence
        if: always() && env.PUBLISH_REQUIRED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-machine-schema-retry-proof
          path: toolchain/ci-out/canonical-contract
          if-no-files-found: warn
          retention-days: 30

      - name: Create candidate directly on guarded main parent
        if: env.PUBLISH_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-canonical-machine-schema*.yml
          rm -rf toolchain/ci-out toolchain/.pytest_cache toolchain/.mypy_cache toolchain/.ruff_cache
          rm -rf toolchain/codex_wire_audit.egg-info toolchain/build toolchain/dist
          rm -f toolchain/.coverage toolchain/coverage.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git ls-files | grep -q '^\.github/workflows/temporary-canonical-machine-schema'; then
            echo 'temporary workflow leaked into candidate tree' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree="$(git write-tree)"
          candidate="$({
            printf '%s\n\n' 'feat: publish canonical machine-readable system contract'
            printf '%s\n' 'Adds codex-system-contract/v1 as the deterministic semantic authority, binds compatibility views by digest, enforces reference closure and secret safety, repairs the local-storage maintainability gate, and replaces the broken recovery path with a read-only permanent proof workflow.'
          } | git commit-tree "$tree" -p "$EXPECTED_MAIN_SHA")"
          git reset --hard "$candidate"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$tree" >> "$GITHUB_ENV"

      - name: Recheck and fast-forward main without force
        if: env.PUBLISH_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$EXPECTED_MAIN_SHA"
          git fetch --no-tags origin main
          current="$(git rev-parse origin/main)"
          if test "$current" != "$EXPECTED_MAIN_SHA"; then
            subject="$(git log -1 --format=%s origin/main)"
            if test "$subject" = 'feat: publish canonical machine-readable system contract' \
               && git cat-file -e 'origin/main:toolchain/schemas/codex-system-contract-v1.schema.json' \
               && git show 'origin/main:toolchain/schemas/codex-system-contract-v1.schema.json' \
                    | grep -q 'codex-system-contract/v1'; then
              echo "Another guarded publisher completed first at $current"
              echo "PUBLISHED_MAIN_SHA=$current" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "main moved unexpectedly to $current" >&2
            exit 1
          fi
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main^{tree})" = "$CANDIDATE_TREE"
          git show 'origin/main:toolchain/schemas/codex-system-contract-v1.schema.json' \
            | grep -q 'codex-system-contract/v1'
          echo "PUBLISHED_MAIN_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"

      - name: Remove temporary canonical branches
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branches = (
              os.environ['RETRY_BRANCH'],
              os.environ['PUBLICATION_BRANCH'],
              os.environ['SOURCE_BRANCH'],
              'codex-bootstrap-canonical-direct-20260909',
              'codex-bootstrap-canonical-final-20260909',
              'codex-bootstrap-canonical-v1',
              'codex-bootstrap-canonical-v1-20260909',
              'codex-bootstrap-source-export-20260908',
              'codex/local-storage-full-schema-20260908',
          )
          for branch in branches:
              encoded_ref = urllib.parse.quote(f'heads/{branch}', safe='/')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/refs/{encoded_ref}',
                  method='DELETE',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'canonical-machine-schema-retry',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      print(branch, response.status)
              except urllib.error.HTTPError as error:
                  if error.code not in {404, 422}:
                      raise
                  print(branch, error.code)
          PY
