name: temporary-canonical-main-finalizer-20260909

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-canonical-main-finalizer-20260909.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: temporary-canonical-main-finalizer-20260909
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
      TEMP_WORKFLOW: .github/workflows/temporary-canonical-main-finalizer-20260909.yml
    steps:
      - name: Check out staged main parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Preserve recovery publishers and record tested parent
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          recovery_ref='codex/canonical-machine-schema-v1-8f27c9'
          if git fetch --no-tags origin "+refs/heads/$recovery_ref:refs/remotes/origin/$recovery_ref"; then
            git show "refs/remotes/origin/$recovery_ref:.github/canonical_machine_schema_publisher.py" > "$RUNNER_TEMP/publisher.py"
            git show "refs/remotes/origin/$recovery_ref:.github/canonical_machine_schema_publisher_v2.py" > "$RUNNER_TEMP/publisher_v2.py"
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Materialize missing canonical assets
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f contracts/codex-system-contract/v1/contract.json || \
             ! test -f toolchain/tools/check_canonical_contract.py; then
            test -s "$RUNNER_TEMP/publisher.py"
            test -s "$RUNNER_TEMP/publisher_v2.py"
            BASE_PUBLISHER="$RUNNER_TEMP/publisher.py" \
              python "$RUNNER_TEMP/publisher_v2.py" | tee "$RUNNER_TEMP/publisher.json"
          fi

      - name: Install constrained package and tests
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'

      - name: Repair stale canonical assets if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! python toolchain/tools/check_canonical_contract.py > "$RUNNER_TEMP/canonical-preflight.json"; then
            test -s "$RUNNER_TEMP/publisher.py"
            test -s "$RUNNER_TEMP/publisher_v2.py"
            BASE_PUBLISHER="$RUNNER_TEMP/publisher.py" \
              python "$RUNNER_TEMP/publisher_v2.py" | tee "$RUNNER_TEMP/publisher-repair.json"
            python toolchain/tools/check_canonical_contract.py > "$RUNNER_TEMP/canonical-preflight.json"
          fi

      - name: Validate the exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-main-final-evidence"
          mkdir -p "$evidence"
          python toolchain/tools/check_canonical_contract.py --output "$evidence/contract-validation.json"
          if test -f toolchain/tools/check_architecture_docs.py; then
            python toolchain/tools/check_architecture_docs.py | tee "$evidence/architecture-docs.txt"
          fi
          (
            cd toolchain
            make compile | tee "$evidence/compile.txt"
            python -m pytest -q | tee "$evidence/pytest.txt"
            make check-assets | tee "$evidence/check-assets.txt"
            python tools/maintainability_metrics.py --check | tee "$evidence/maintainability.txt"
            python -m codex_wire_audit.release_contract --output "$evidence/source-capability-probe.json"
          )
          python - <<'PY' | tee "$evidence/fragment-safety.json"
          from __future__ import annotations
          import importlib
          import json
          from pathlib import Path
          fragments = sorted(Path("toolchain/codex_wire_audit/extractors").glob("_local_storage_part_*.py"))
          for fragment in fragments:
              module = importlib.import_module("codex_wire_audit.extractors." + fragment.stem)
              leaked = sorted(name for name in vars(module) if name.startswith("extract_"))
              if leaked:
                  raise SystemExit(f"fragment leaked extractor registrations: {fragment}: {leaked}")
          print(json.dumps({"direct_import_safe": True, "fragment_count": len(fragments)}, sort_keys=True))
          PY

      - name: Validate pinned Codex integration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-main-final-evidence"
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          mkdir -p "$evidence/pinned-config-surface"
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output "$evidence/pinned-config-surface/integration.json" \
            --schema-output "$evidence/pinned-config-surface/config-schema.json" \
            --graph-output "$evidence/pinned-config-surface/config-surface-graph.json"

      - name: Write durable proof and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p contracts/codex-system-contract/v1
          python - "$BASE_SHA" "$GITHUB_RUN_ID" > contracts/codex-system-contract/v1/publication.json <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import sys
          contract = json.loads(Path("contracts/codex-system-contract/v1/contract.json").read_text())
          print(json.dumps({
              "schema": "codex-system-contract/v1",
              "status": "validated-for-publication",
              "strategy": "guarded-fast-forward",
              "force": False,
              "base_sha": sys.argv[1],
              "workflow_run_id": int(sys.argv[2]),
              "canonical_sha256": contract["integrity"]["canonical_sha256"],
              "pinned_codex_commit": contract["source"]["pinned_codex_commit"],
              "gates": [
                  "json-schema-2020-12", "reference-integrity", "surface-coverage",
                  "evidence-digest-revalidation", "compatibility-projection-digests",
                  "canonical-content-digest", "secret-safety", "compile",
                  "complete-pytest-suite", "deterministic-assets", "maintainability",
                  "source-capability-probe", "fragment-discovery-safety",
                  "architecture-documentation", "pinned-codex-integration"
              ]
          }, indent=2, sort_keys=True))
          PY
          python - <<'PY' > CANONICAL_MACHINE_SCHEMA_EVIDENCE.md
          from __future__ import annotations
          import json
          from pathlib import Path
          data = json.loads(Path("contracts/codex-system-contract/v1/publication.json").read_text())
          gates = "\n".join(f"- `{name}`" for name in data["gates"])
          print(f"""# Canonical machine-schema publication evidence

The exact candidate tree passed every listed gate before publication as the
canonical `codex-system-contract/v1` representation.

- Publication strategy: `{data['strategy']}`
- Force update: `{str(data['force']).lower()}`
- Tested parent: `{data['base_sha']}`
- Canonical SHA-256: `{data['canonical_sha256']}`
- Pinned Codex commit: `{data['pinned_codex_commit']}`
- Workflow run: `{data['workflow_run_id']}`

## Passing gates

{gates}

Immediately before publication, the workflow re-fetches `main` and requires the
tested candidate parent to equal the current head. Any stale candidate aborts;
no force update or untested rebase is permitted.
""")
          PY
          rm -f "$TEMP_WORKFLOW"
          python toolchain/tools/check_canonical_contract.py > "$RUNNER_TEMP/canonical-main-final-evidence/post-proof-contract.json"

      - name: Commit one clean child and guarded fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/canonical-main-final-evidence"
          git diff --check
          git add -A
          git diff --cached --check
          git diff --cached --no-ext-diff --binary > "$RUNNER_TEMP/canonical-main-final.patch"
          if grep -E 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' "$RUNNER_TEMP/canonical-main-final.patch"; then
            echo 'secret-like material found in candidate patch' >&2
            exit 1
          fi
          git config user.name 'Jacob'
          git config user.email '240170694+wignerStan@users.noreply.github.com'
          git commit -m 'feat: finalize canonical machine-readable system contract' \
            -m 'Publish schema, strict integrity validation, namespace-safe source modularization, permanent read-only proof, and durable publication evidence from one tested tree.'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/codex/canonical-main-final-candidate-20260909"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          test "$current_main" = "$BASE_SHA" || {
            echo "main moved: expected $BASE_SHA, found $current_main" >&2
            exit 1
          }
          test "$(git rev-parse HEAD^)" = "$current_main"
          git push origin HEAD:refs/heads/main
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$candidate_sha"
          python - "$BASE_SHA" "$candidate_sha" > "$evidence/publication-result.json" <<'PY'
          import json
          import sys
          print(json.dumps({"status": "published", "strategy": "guarded-fast-forward", "force": False, "base_sha": sys.argv[1], "candidate_sha": sys.argv[2], "schema": "codex-system-contract/v1"}, indent=2, sort_keys=True))
          PY

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-main-final-evidence
          path: ${{ runner.temp }}/canonical-main-final-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary refs
        if: success()
        shell: bash
        run: |
          git push origin --delete codex/canonical-main-final-candidate-20260909 || true
          git push origin --delete codex/canonical-machine-schema-final-candidate-20260909 || true
          git push origin --delete codex/canonical-machine-schema-final-20260909 || true
          git push origin --delete codex/canonical-machine-schema-candidate-v2-8f27c9 || true
          git push origin --delete codex/canonical-machine-schema-candidate-8f27c9 || true
          git push origin --delete codex/canonical-machine-schema-v1-8f27c9 || true
