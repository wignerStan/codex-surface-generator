name: tmp-regenerate-canonical-assets

on:
  push:
    branches:
      - contract/responses/feat/server-response-surface

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: contract/responses/feat/server-response-surface
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install constrained test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Regenerate and verify legacy canonical assets
        working-directory: toolchain
        run: |
          make legacy-assets
          make check-legacy-assets
      - name: Commit deterministic assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain/codex_wire_audit_v11_examples toolchain/codex_wire_audit_v11_schemas
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate canonical source registry assets"
          git push origin HEAD:contract/responses/feat/server-response-surface
