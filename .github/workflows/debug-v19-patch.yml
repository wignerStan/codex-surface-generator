name: debug-v19-patch-transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-v19-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruct correction and print exact identity
        shell: bash
        run: |
          set -euxo pipefail
          {
            head -c 8000 .github/v19-config-surface-code.patch.b64.part-00
            cat .github/v19-config-surface-code.patch.b64.part-0[1-5]
          } > "$RUNNER_TEMP/correction.b64"
          base64 --decode "$RUNNER_TEMP/correction.b64" > "$RUNNER_TEMP/correction.patch"
          wc -c "$RUNNER_TEMP/correction.b64" "$RUNNER_TEMP/correction.patch"
          sha256sum "$RUNNER_TEMP/correction.patch"
          cat .github/v19-config-surface-code.patch.sha256
          expected=$(cut -d' ' -f1 .github/v19-config-surface-code.patch.sha256)
          actual=$(sha256sum "$RUNNER_TEMP/correction.patch" | cut -d' ' -f1)
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
