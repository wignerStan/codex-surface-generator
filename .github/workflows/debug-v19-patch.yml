name: debug-v19-patch-transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-v19-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compare every transported fragment
        shell: bash
        run: |
          set -euxo pipefail
          expected=(
            a70d23a4a12d4f3f1ab3d26f552a81e7e8c3e0c33f314c5b1b685b898b9029a7
            90654bd211c0ea95167fae87d64091667115573410e2f67dbda7f2eeefd2943c
            3ee2f5747df6cdbfda06af687310f09d6271340f0d8823a59d376b2abfcaa3d4
            ff2b0896f87cc22a3b5e7f79a66bdcb554f99ce9201b0d5a4e9e98d149f367d5
            7446e34bdd1eb66cfe8334e77dc154df77121ea97c32e956031d410836f5c65c
            a62948998e3e471746ea32794bce1ad5024204156f8fc8ce994e3b25ce67bec7
          )
          for i in 0 1 2 3 4 5; do
            file=$(printf '.github/v19-config-surface-code.patch.b64.part-%02d' "$i")
            if [ "$i" -eq 0 ]; then
              head -c 8000 "$file" > "$RUNNER_TEMP/part-$i"
            else
              cp "$file" "$RUNNER_TEMP/part-$i"
            fi
            actual=$(sha256sum "$RUNNER_TEMP/part-$i" | cut -d' ' -f1)
            bytes=$(wc -c < "$RUNNER_TEMP/part-$i")
            printf 'part-%02d bytes=%s expected=%s actual=%s\n' "$i" "$bytes" "${expected[$i]}" "$actual"
          done

          cat "$RUNNER_TEMP"/part-{0,1,2,3,4,5} > "$RUNNER_TEMP/correction.b64"
          base64 --decode "$RUNNER_TEMP/correction.b64" > "$RUNNER_TEMP/correction.patch"
          sha256sum "$RUNNER_TEMP/correction.patch"
          cat .github/v19-config-surface-code.patch.sha256
