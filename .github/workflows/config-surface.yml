name: config-surface-v19

on:
  push:
    paths:
      - "toolchain/**"
      - ".github/workflows/config-surface.yml"
  pull_request:
    paths:
      - "toolchain/**"
      - ".github/workflows/config-surface.yml"
  workflow_dispatch:
  schedule:
    - cron: "31 7 * * 1"

permissions:
  contents: read

concurrency:
  group: config-surface-v19-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Run all unit, schema, asset, and maintainability checks
        working-directory: toolchain
        run: |
          python -m pytest -q
          make check-assets
          python tools/maintainability_metrics.py --check
      - name: Probe the installed package capability closure
        working-directory: toolchain
        run: |
          mkdir -p ci-out
          python -m codex_wire_audit.release_contract \
            --output ci-out/source-capability-probe.json
      - name: Upload package proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: config-surface-v19-package-proof
          path: toolchain/ci-out
          if-no-files-found: warn
          retention-days: 14

  pinned-codex-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openai/codex
          ref: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
          path: codex-source
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install generator
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Generate and verify the full configuration surface
        run: |
          mkdir -p toolchain/ci-out/config-surface
          python toolchain/tools/check_config_surface.py \
            --codex-root codex-source \
            --output toolchain/ci-out/config-surface/integration.json \
            --schema-output toolchain/ci-out/config-surface/config-schema.json \
            --graph-output toolchain/ci-out/config-surface/config-surface-graph.json
      - name: Upload pinned integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: config-surface-v19-pinned-codex
          path: toolchain/ci-out/config-surface
          if-no-files-found: error
          retention-days: 30

  current-main-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openai/codex
          ref: main
          path: codex-current-main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install generator
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Run current-main config-surface canary
        run: |
          mkdir -p toolchain/ci-out/current-main
          python toolchain/tools/check_config_surface.py \
            --codex-root codex-current-main \
            --output toolchain/ci-out/current-main/integration.json \
            --schema-output toolchain/ci-out/current-main/config-schema.json \
            --graph-output toolchain/ci-out/current-main/config-surface-graph.json
      - name: Upload current-main canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: config-surface-v19-current-main
          path: toolchain/ci-out/current-main
          if-no-files-found: warn
          retention-days: 14
