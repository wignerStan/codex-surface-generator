name: direct-contract-migration

on:
  push:
    branches:
      - review/canonical-contract-20260909
    paths:
      - .github/workflows/direct-contract-migration.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: direct-contract-migration-review
  cancel-in-progress: false

jobs:
  migrate-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REVIEW_BASE: b7b37ef361e55041e3d895f4b65d197d1f2244c4
      REVIEW_BRANCH: review/canonical-contract-20260909
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - name: Check out exact staging commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify the bounded Git-object staging delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$REVIEW_BRANCH"
          git merge-base --is-ancestor "$REVIEW_BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$REVIEW_BASE"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/direct-contract-migration.py'
          test "${changed[1]}" = '.github/workflows/direct-contract-migration.yml'

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Install constrained package and test dependencies
        run: python -m pip install --constraint toolchain/ci/constraints.txt -e './toolchain[test]'

      - name: Materialize the direct-only contract implementation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/direct-contract-proof"
          python .github/direct-contract-migration.py \
            | tee "$RUNNER_TEMP/direct-contract-proof/migration.json"
          rm -f \
            .github/direct-contract-migration.py \
            .github/workflows/direct-contract-migration.yml \
            .github/workflows/review-canonical-source.yml

      - name: Regenerate deterministic source assets
        working-directory: toolchain
        run: |
          set -euo pipefail
          python tools/build_v11_assets.py
          python tools/check_canonical_contract.py --write-assets
          python tools/maintainability_metrics.py --write

      - name: Prove that no adapter or parallel machine path remains
        shell: bash
        run: |
          set -euo pipefail
          test ! -e toolchain/codex_wire_audit/compatibility_views.py
          ! grep -R -n -E 'compatibility_views|apply_config_surface_overlay|apply_local_storage_overlay' \
            toolchain/codex_wire_audit toolchain/tools toolchain/tests contracts \
            .github/workflows/canonical-proof.yml README.md CANONICAL_REVIEW.md
          python - <<'PY' | tee "$RUNNER_TEMP/direct-contract-proof/direct-shape.json"
          import json
          from pathlib import Path
          fixture = json.loads(Path('contracts/codex-system-contract/v1/example.fixture.json').read_text())
          schema = json.loads(Path('toolchain/codex_wire_audit_v11_schemas/system-contract.schema.json').read_text())
          assert 'compatibility_views' not in fixture
          assert 'compatibility_views' not in json.dumps(schema, sort_keys=True)
          assert set(fixture) == {'$schema', 'schema', 'authority', 'model', 'integrity'}
          print(json.dumps({'single_contract': True, 'keys': sorted(fixture)}, sort_keys=True))
          PY

      - name: Stage the exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          echo "TESTED_TREE=$(git write-tree)" >> "$GITHUB_ENV"
          git diff --cached --stat | tee "$RUNNER_TEMP/direct-contract-proof/candidate-stat.txt"

      - name: Compile and run the complete test suite
        working-directory: toolchain
        run: |
          set -euo pipefail
          make compile
          python -m pytest -q | tee "$RUNNER_TEMP/direct-contract-proof/pytest.txt"

      - name: Verify deterministic assets, maintainability, and contract closure
        working-directory: toolchain
        run: |
          set -euo pipefail
          make check-assets | tee "$RUNNER_TEMP/direct-contract-proof/assets.txt"
          python tools/maintainability_metrics.py --check \
            | tee "$RUNNER_TEMP/direct-contract-proof/maintainability.txt"
          python tools/check_canonical_contract.py \
            --output "$RUNNER_TEMP/direct-contract-proof/fixture-contract.json"
          python -m codex_wire_audit.release_contract \
            --output "$RUNNER_TEMP/direct-contract-proof/source-capabilities.json"

      - name: Verify proof-critical branch and line coverage
        working-directory: toolchain
        run: |
          set -euo pipefail
          coverage erase
          coverage run --branch -m pytest -q
          coverage json -o "$RUNNER_TEMP/direct-contract-proof/coverage.json"
          python tools/check_v13_coverage.py \
            "$RUNNER_TEMP/direct-contract-proof/coverage.json" \
            --output "$RUNNER_TEMP/direct-contract-proof/coverage-ratchet.json"

      - name: Validate pinned Codex source bytes and direct report shape
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/direct-contract-proof/pinned"
          codex="$RUNNER_TEMP/codex-source"
          mkdir -p "$proof"
          git init -q "$codex"
          git -C "$codex" remote add origin https://github.com/openai/codex.git
          git -C "$codex" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex" checkout -q --detach FETCH_HEAD
          test "$(git -C "$codex" rev-parse HEAD)" = "$PINNED_CODEX_SHA"
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex" --output "$proof/config-integration.json"
          python -m codex_wire_audit --json \
            --repo-root "$codex" --coverage-profile hybrid_v19 \
            --emit-system-contract "$proof/system-contract.json" \
            --output "$proof/report.json"
          python toolchain/tools/check_canonical_contract.py \
            --report "$proof/report.json" --source-root "$codex" \
            --output "$proof/source-byte-proof.json"
          python - "$proof/report.json" "$proof/system-contract.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text())
          standalone = json.loads(Path(sys.argv[2]).read_text())
          forbidden = {'config_schema', 'config_surface_graph', 'evolution_contract', 'local_storage_schema'}
          assert not (forbidden & set(report)), forbidden & set(report)
          assert report['system_contract'] == standalone
          assert 'compatibility_views' not in report['system_contract']
          assert set(report['system_contract']) == {'$schema', 'schema', 'authority', 'model', 'integrity'}
          PY

      - name: Build and independently verify release closure
        working-directory: toolchain
        run: |
          set -euo pipefail
          python tools/release_pipeline.py release \
            --output-dir "$RUNNER_TEMP/direct-contract-release" \
            | tee "$RUNNER_TEMP/direct-contract-proof/release.json"
          python tools/release_pipeline.py verify \
            --release-dir "$RUNNER_TEMP/direct-contract-release" \
            | tee "$RUNNER_TEMP/direct-contract-proof/release-verification.json"

      - name: Publish only the exact tested tree to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = "$TESTED_TREE"
          git diff --cached --check
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make the canonical contract direct and singular' \
            -m 'Remove report mirrors and the installed adapter module; require consumers to use the versioned source-derived contract directly. Strengthen required-source completeness, source decoding, deterministic assets, tests, and read-only proof gates.'
          candidate="$(git rev-parse HEAD)"
          git fetch --no-tags origin "refs/heads/$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "$candidate"
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          git fetch --no-tags origin "refs/heads/$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$candidate"
          printf '{"status":"published","commit":"%s","tree":"%s","parent":"%s","force":false}\n' \
            "$candidate" "$TESTED_TREE" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/direct-contract-proof/publication.json"

      - name: Record success on pull request 4
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/issues/4/comments" \
            --method POST \
            --field body="Direct-only canonical migration published at \`$commit\`. The exact tree passed the complete suite, deterministic assets, maintainability, coverage, pinned-source byte validation, direct-shape assertions, and independent release verification. No force update was used; the one-use workflow and prior staging workflow are absent from the candidate tree."

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: direct-contract-proof
          path: |
            ${{ runner.temp }}/direct-contract-proof
            ${{ runner.temp }}/direct-contract-release
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary staging files after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          rm -f .github/direct-contract-migration.py .github/workflows/direct-contract-migration.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove failed one-use migration staging'
          git fetch --no-tags origin "refs/heads/$REVIEW_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
