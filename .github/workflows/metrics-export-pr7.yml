name: pr7-diagnostic-export

on:
  push:
    branches: [ci/metrics-export-pr7]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: toolchain

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: f157087843a5d6737940c5e841e7722ea14b3425
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained dependencies
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Export exact failing report without weakening the PR gate
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/pr7-diagnostics"
          codex="$RUNNER_TEMP/codex-source"
          mkdir -p "$proof"
          git init -q "$codex"
          git -C "$codex" remote add origin https://github.com/openai/codex.git
          git -C "$codex" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex" checkout -q --detach FETCH_HEAD
          test "$(git -C "$codex" rev-parse HEAD)" = "$PINNED_CODEX_SHA"
          codex-wire-audit --json --repo-root "$codex" --coverage-profile hybrid_v19 \
            --fail-on never --emit-system-contract "$proof/system-contract.json" \
            --output "$proof/report.json"
          python - "$proof/report.json" "$proof/diagnostics.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          payload = {
              'status': report.get('status'),
              'diagnostic_summary': report.get('diagnostic_summary'),
              'diagnostics': report.get('diagnostics', []),
          }
          json.dump(payload, open(sys.argv[2], 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr7-failing-diagnostics
          path: |
            ${{ runner.temp }}/pr7-diagnostics/report.json
            ${{ runner.temp }}/pr7-diagnostics/system-contract.json
            ${{ runner.temp }}/pr7-diagnostics/diagnostics.json
          if-no-files-found: error
          retention-days: 1
