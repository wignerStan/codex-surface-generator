name: metrics-export-pr7

on:
  push:
    branches: [ci/metrics-export-pr7]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: canonical-proof/fix/cli-entrypoint
      EXPECTED_TARGET_SHA: 14d4326d02f58b6026e9274064013e824df04abc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Regenerate and publish exact maintainability assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET_SHA"
          git checkout --detach "$EXPECTED_TARGET_SHA"
          cd toolchain
          python tools/maintainability_metrics.py --write
          cd ..
          test "$(git diff --name-only | sort)" = $'toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md\ntoolchain/codex_wire_audit_v19_maintainability_metrics.json'
          git add toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md toolchain/codex_wire_audit_v19_maintainability_metrics.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(metrics): refresh canonical proof metrics'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Upload generated assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr7-maintainability-assets-published
          path: |
            toolchain/codex_wire_audit_v19_maintainability_metrics.json
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          if-no-files-found: error
          retention-days: 1
