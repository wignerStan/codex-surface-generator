name: pr7-classifier-repair

on:
  push:
    branches: [ci/metrics-export-pr7]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: canonical-proof/fix/cli-entrypoint
      EXPECTED_TARGET_SHA: f157087843a5d6737940c5e841e7722ea14b3425
      PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Patch, prove, and publish exact repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET_SHA"
          git checkout --detach "$EXPECTED_TARGET_SHA"

          python - <<'PY'
          from pathlib import Path

          path = Path('toolchain/codex_wire_audit/extractors/local_storage_specs.py')
          text = path.read_text(encoding='utf-8')
          old = '        \'format!("rollout-{timestamp}-{}_{}.jsonl"\','
          new = '        \'"rollout-{timestamp}-{}_{}.jsonl"\','
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('toolchain/codex_wire_audit/schema_identity.py')
          text = path.read_text(encoding='utf-8')
          old = '''            else:\n                source_path = _source_path_from_rows(rows)\n                qualified = qualified_rust_name(source_path, name)\n                schema_id = schema_id_for_qualified_name(qualified)\n'''
          new = '''            else:\n                source_path = _source_path_from_rows(rows)\n                enum_variant = re.search(r"/enums/([^/]+)/variants/\\d+/fields$", pointer)\n                identity_name = f"{enum_variant.group(1)}::{name}" if enum_variant else name\n                qualified = qualified_rust_name(source_path, identity_name)\n                schema_id = schema_id_for_qualified_name(qualified)\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('toolchain/test_codex_wire_audit_v11.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    def test_path_hash_fallback_is_collision_safe(self) -> None:\n'''
          assert text.count(anchor) == 1
          test = '''    def test_same_named_enum_variants_include_parent_enum_in_schema_id(self) -> None:\n        source = {"path": "codex-rs/protocol/src/models.rs"}\n        report = {\n            "responses_protocol": {\n                "input_and_output_items": {\n                    "enums": {\n                        "ResponseInputItem": {\n                            "name": "ResponseInputItem",\n                            "variants": [\n                                {\n                                    "name": "ToolSearchOutput",\n                                    "fields": [{"name": "call_id", "rust_type": "String", "source": source}],\n                                }\n                            ],\n                        },\n                        "ResponseItem": {\n                            "name": "ResponseItem",\n                            "variants": [\n                                {\n                                    "name": "ToolSearchOutput",\n                                    "fields": [{"name": "call_id", "rust_type": "Option<String>", "source": source}],\n                                }\n                            ],\n                        },\n                    }\n                }\n            }\n        }\n        resolver = SchemaIdentityResolver.from_report(report)\n        input_pointer = "/responses_protocol/input_and_output_items/enums/ResponseInputItem/variants/0/fields"\n        output_pointer = "/responses_protocol/input_and_output_items/enums/ResponseItem/variants/0/fields"\n        input_id = resolver.schema_id("ToolSearchOutput", input_pointer)\n        output_id = resolver.schema_id("ToolSearchOutput", output_pointer)\n        self.assertEqual(input_id, "schema.rust.protocol.models.responseinputitem.toolsearchoutput")\n        self.assertEqual(output_id, "schema.rust.protocol.models.responseitem.toolsearchoutput")\n        self.assertNotEqual(input_id, output_id)\n\n'''
          path.write_text(text.replace(anchor, test + anchor, 1), encoding='utf-8')

          path = Path('toolchain/tests/test_local_storage_v19.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def test_local_storage_semantic_drift_is_fail_visible() -> None:\n'''
          assert text.count(anchor) == 1
          test = '''def test_rollout_filename_marker_accepts_rustfmt_line_break() -> None:\n    source = SOURCE_TEXTS['rollout_filename'].replace(\n        'format!("rollout-{timestamp}-{}_{}.jsonl", self.thread_id, self.rollout_id)',\n        'format!(\\n            "rollout-{timestamp}-{}_{}.jsonl",\\n            self.thread_id, self.rollout_id\\n        )',\n    )\n    result, diagnostics = _extract({'rollout_filename': source})\n    assert result.semantic_complete is True\n    assert 'LOCAL_STORAGE_SEMANTIC_MARKER_MISSING' not in {item.code for item in diagnostics.values()}\n\n'''
          path.write_text(text.replace(anchor, test + anchor, 1), encoding='utf-8')
          PY

          cd toolchain
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python tools/maintainability_metrics.py --write
          python -m pytest -q
          make check-assets
          python tools/check_canonical_contract.py

          proof="$RUNNER_TEMP/pr7-proof"
          codex="$RUNNER_TEMP/codex-source"
          mkdir -p "$proof"
          git init -q "$codex"
          git -C "$codex" remote add origin https://github.com/openai/codex.git
          git -C "$codex" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex" checkout -q --detach FETCH_HEAD
          test "$(git -C "$codex" rev-parse HEAD)" = "$PINNED_CODEX_SHA"
          python tools/check_config_surface.py --codex-root "$codex" --output "$proof/config-integration.json"
          codex-wire-audit --json --repo-root "$codex" --coverage-profile hybrid_v19 \
            --emit-system-contract "$proof/system-contract.json" --output "$proof/report.json"
          python tools/check_canonical_contract.py --report "$proof/report.json" \
            --source-root "$codex" --output "$proof/source-byte-proof.json"
          cd ..

          expected=$'toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md\ntoolchain/codex_wire_audit/extractors/local_storage_specs.py\ntoolchain/codex_wire_audit/schema_identity.py\ntoolchain/codex_wire_audit_v19_maintainability_metrics.json\ntoolchain/test_codex_wire_audit_v11.py\ntoolchain/tests/test_local_storage_v19.py'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git diff --check

          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_TARGET_SHA"
          git add $expected
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(canonical-proof): qualify source semantics'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
