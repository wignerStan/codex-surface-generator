name: metrics-export-pr7

on:
  push:
    branches: [ci/metrics-export-pr7]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: toolchain

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Regenerate exact maintainability assets
        run: python tools/maintainability_metrics.py --write
      - name: Upload generated assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr7-maintainability-assets
          path: |
            toolchain/codex_wire_audit_v19_maintainability_metrics.json
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          if-no-files-found: error
          retention-days: 1
