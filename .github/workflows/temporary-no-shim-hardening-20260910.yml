name: temporary-no-shim-hardening-20260910

on:
  push:
    branches:
      - hardening/canonical-no-shim-20260910
    paths:
      - .github/workflows/temporary-no-shim-hardening-20260910.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-no-shim-hardening-20260910
  cancel-in-progress: false

jobs:
  harden-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact staged branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Record immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'hardening/canonical-no-shim-20260910'
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt

      - name: Install constrained development dependencies
        run: python -m pip install --constraint toolchain/ci/constraints.txt -e './toolchain[test]'

      - name: Materialize direct canonical design
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/direct-contract-migration-v2.py
          python .github/direct-contract-migration-v2.py
          rm -f .github/direct-contract-migration-v2.py
          rm -f .github/workflows/review-canonical-source.yml
          rm -f .github/workflows/canonical-representation-v2.yml
          rm -f .github/canonical_bootstrap_v2.py
          rm -f .github/workflows/temporary-canonical-main-finalizer-20260909.yml

      - name: Enforce no compatibility shim or transitional publisher
        shell: bash
        run: |
          set -euo pipefail
          test ! -e toolchain/codex_wire_audit/compatibility_views.py
          test ! -e .github/direct-contract-migration-v2.py
          test ! -e .github/workflows/review-canonical-source.yml
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root = Path('toolchain/codex_wire_audit')
          forbidden_modules = {'compatibility_views'}
          forbidden_report_keys = {
              'evolution_contract', 'local_storage_schema', 'config_schema',
              'config_surface_graph', 'config_protocol',
          }
          violations: list[str] = []
          for path in sorted(root.rglob('*.py')):
              try:
                  tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              except SyntaxError as error:
                  violations.append(f'{path}: syntax error: {error}')
                  continue
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module:
                      if node.module.rsplit('.', 1)[-1] in forbidden_modules:
                          violations.append(f'{path}:{node.lineno}: imports compatibility shim')
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.rsplit('.', 1)[-1] in forbidden_modules:
                              violations.append(f'{path}:{node.lineno}: imports compatibility shim')
                  elif isinstance(node, (ast.Subscript, ast.Constant)):
                      value = None
                      if isinstance(node, ast.Constant) and isinstance(node.value, str):
                          value = node.value
                      elif isinstance(node, ast.Subscript):
                          slice_node = node.slice
                          if isinstance(slice_node, ast.Constant) and isinstance(slice_node.value, str):
                              value = slice_node.value
                      if value in forbidden_report_keys:
                          violations.append(f'{path}:{getattr(node, "lineno", 0)}: legacy report key {value!r}')
          if violations:
              raise SystemExit('\n'.join(violations))
          PY

      - name: Generate deterministic assets
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_v11_assets.py
          if python tools/check_canonical_contract.py --help 2>&1 | grep -q -- '--write-assets'; then
            python tools/check_canonical_contract.py --write-assets
          fi
          python tools/maintainability_metrics.py --write

      - name: Prove exact candidate
        working-directory: toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-shim-proof"
          make compile
          python -m pytest -q | tee "$RUNNER_TEMP/no-shim-proof/pytest.txt"
          make check-assets | tee "$RUNNER_TEMP/no-shim-proof/assets.txt"
          python tools/maintainability_metrics.py --check | tee "$RUNNER_TEMP/no-shim-proof/maintainability.txt"
          python tools/check_canonical_contract.py --output "$RUNNER_TEMP/no-shim-proof/canonical.json"
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/no-shim-proof/source-capabilities.json"
          python tools/release_pipeline.py release --output-dir "$RUNNER_TEMP/no-shim-release" | tee "$RUNNER_TEMP/no-shim-proof/release.json"
          python tools/release_pipeline.py verify --release-dir "$RUNNER_TEMP/no-shim-release" | tee "$RUNNER_TEMP/no-shim-proof/release-verify.json"

      - name: Validate pinned Codex integration
        shell: bash
        env:
          PINNED_CODEX_SHA: 6af345407d9c2a568da9d01b6c4b81a9e61495c0
        run: |
          set -euo pipefail
          codex_root="$RUNNER_TEMP/codex-source"
          git init -q "$codex_root"
          git -C "$codex_root" remote add origin https://github.com/openai/codex.git
          git -C "$codex_root" fetch --depth=1 origin "$PINNED_CODEX_SHA"
          git -C "$codex_root" checkout -q --detach FETCH_HEAD
          python toolchain/tools/check_config_surface.py \
            --codex-root "$codex_root" \
            --output "$RUNNER_TEMP/no-shim-proof/pinned-integration.json" \
            --schema-output "$RUNNER_TEMP/no-shim-proof/config-schema.json" \
            --graph-output "$RUNNER_TEMP/no-shim-proof/config-surface-graph.json"

      - name: Publish only the proved hardening branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-no-shim-hardening-20260910.yml
          git add -A
          git diff --cached --check
          tested_tree="$(git write-tree)"
          test -n "$tested_tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce one direct canonical contract without shims'
          git fetch --no-tags origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$START_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          printf '{"start":"%s","commit":"%s","tree":"%s","force":false}\n' \
            "$START_SHA" "$(git rev-parse HEAD)" "$tested_tree" \
            > "$RUNNER_TEMP/no-shim-proof/publication.json"

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-no-shim-hardening-proof
          path: ${{ runner.temp }}/no-shim-proof
          if-no-files-found: warn
          retention-days: 30
