name: tmp-wire-models-etag

on:
  push:
    branches:
      - contract/responses/feat/server-response-surface

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: contract/responses/feat/server-response-surface
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Wire source registry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("toolchain/codex_wire_audit/source_registry.py")
          text = path.read_text(encoding="utf-8")
          if "_RESPONSES_SERVER_RESPONSE_SPECS = (" not in text:
              block = '''_RESPONSES_SERVER_RESPONSE_SPECS = (
              ("source_spec.base.common", "common", "codex-rs/codex-api/src/common.rs", ("ResponseEvent", "ServerModel", "ModelsEtag")),
              ("source_spec.base.response_sse", "response_sse", "codex-rs/codex-api/src/sse/responses.rs", ("spawn_response_stream", "ResponsesStreamEvent", "ResponseEvent::ModelsEtag")),
              ("source_spec.base.ws", "ws", "codex-rs/codex-api/src/endpoint/responses_websocket.rs", ("run_websocket_response_stream", "X_MODELS_ETAG_HEADER", "ResponseEvent::ModelsEtag")),
              ("source_spec.extra.prompt_turn", "prompt_turn", "codex-rs/core/src/session/turn.rs", ("ResponseEvent::ModelsEtag", "refresh_if_new_etag")),
              ("source_spec.extra.models_manager", "models_manager", "codex-rs/models-manager/src/manager.rs", ("refresh_if_new_etag", "fetch_and_update_models", "RefreshStrategy::Online", "ModelsCacheEntry")),
              ("source_spec.surface.models_endpoint", "models_endpoint", "codex-rs/codex-api/src/endpoint/models.rs", ("ModelsClient", "request_url", "list_models", "ETAG", "ModelsResponse")),
              ("source_spec.surface.model_provider_models", "model_provider_models", "codex-rs/model-provider/src/models_endpoint.rs", ("OpenAiModelsEndpoint", "ModelsClient", "ModelsEndpointResponse")),
          )

          '''
              anchor = "_RUNTIME_BEHAVIOR_SPECS = (\n"
              if anchor not in text:
                  raise SystemExit("runtime behavior source-spec anchor not found")
              text = text.replace(anchor, block + anchor, 1)

              merge_anchor = '''        (_RESPONSE_EVENT_SPECS, "response_events", "extractor.response_events"),
                  (_RUNTIME_BEHAVIOR_SPECS, "runtime_behavior", "extractor.runtime_behavior"),'''
              merge_replacement = '''        (_RESPONSE_EVENT_SPECS, "response_events", "extractor.response_events"),
                  (_RESPONSES_SERVER_RESPONSE_SPECS, "responses_server_response", "extractor.responses_server_response"),
                  (_RUNTIME_BEHAVIOR_SPECS, "runtime_behavior", "extractor.runtime_behavior"),'''
              if merge_anchor not in text:
                  raise SystemExit("protocol-domain merge anchor not found")
              text = text.replace(merge_anchor, merge_replacement, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install test dependencies
        working-directory: toolchain
        run: python -m pip install -e '.[test]'
      - name: Targeted server-response tests
        working-directory: toolchain
        run: pytest -q tests/test_responses_server_response_extractor.py
      - name: Regenerate maintainability metrics
        working-directory: toolchain
        run: python tools/maintainability_metrics.py --write
      - name: Full unit suite
        working-directory: toolchain
        run: pytest -q
      - name: Commit generated wiring and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchain/codex_wire_audit/source_registry.py \
                  toolchain/codex_wire_audit_v19_maintainability_metrics.json \
                  toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(responses): wire models etag catalog refresh sources"
          git push origin HEAD:contract/responses/feat/server-response-surface
