name: history-mutation-refresh

on:
  push:
    branches: [ci/history-mutation-refresh]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/history-mutation-refresh
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Build exact history mutation contract
        run: |
          set -euo pipefail
          cp .github/scripts/build_history_mutation.py "$RUNNER_TEMP/build_history_mutation.py"
          git reset --hard 153a32f12f38466ff77b552858aace0ae2809746
          git checkout -b contract/app-server/feat/history-mutation
          python "$RUNNER_TEMP/build_history_mutation.py"
          python - <<'PY'
          from pathlib import Path
          path = Path("toolchain/codex_wire_audit/extractors/app_server_history_mutation.py")
          text = path.read_text()
          broken = '("APP_SERVER_REVERT_STABLE_THREAD_ID_MISSING", "RolloutRecorderParams::new(\n        source_meta.id,"),'
          replacement = '''("APP_SERVER_REVERT_STABLE_THREAD_RECORDER_MISSING", "RolloutRecorderParams::new("),
                      ("APP_SERVER_REVERT_STABLE_THREAD_ID_MISSING", "source_meta.id,"),'''
          if broken not in text:
              raise SystemExit("expected generated stable-thread marker was not found")
          path.write_text(text.replace(broken, replacement, 1))
          PY
          git diff --check
      - name: Validate and regenerate deterministic assets
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python -m pytest -q tests/test_app_server_rpc_extractor.py
          python -m pytest -q
          python tools/maintainability_metrics.py --write
          make legacy-assets
          make check-assets
          python tools/check_canonical_contract.py
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/source-capabilities.json"
      - name: Commit topic
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "Jacob"
          git config user.email "240170694+wignerStan@users.noreply.github.com"
          git commit -m "feat(app-server): model fork and revert history mutation"
          git push origin HEAD:refs/heads/contract/app-server/feat/history-mutation
