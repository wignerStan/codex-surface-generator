name: storage-contract-refresh

on:
  push:
    branches: [ci/storage-contract-refresh]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/storage-contract-refresh
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Sync current main into storage topic
        run: |
          set -euo pipefail
          git fetch origin main contract/storage/fix/restart-projection-semantics
          git checkout -B contract/storage/fix/restart-projection-semantics origin/contract/storage/fix/restart-projection-semantics
          git config user.name "codex-contract-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit origin/main
      - name: Validate synced topic
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python -m pytest -q tests/test_local_storage_v19.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          make check-assets
          python tools/check_canonical_contract.py
      - name: Commit regenerated assets and push
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(storage): refresh generated assets after main sync"
          fi
          git push origin HEAD:contract/storage/fix/restart-projection-semantics
