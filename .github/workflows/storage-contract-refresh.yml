name: storage-contract-refresh

on:
  push:
    branches: [ci/storage-contract-refresh]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: contract/storage/fix/steer-boundary
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Require exact steer fields in v2 schema
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bdbfe59a1949d82f5d9b4b5165c5bca4f7d2bf1b"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("toolchain/codex_wire_audit/proof_schema_templates/local-storage-semantics-v2.schema.json")
          schema = json.loads(path.read_text())
          revert = schema["properties"]["transitions"]["properties"]["revert"]
          required = revert["required"]
          for field in (
              "steer_representation",
              "steer_independent_branch_supported",
              "tui_steer_branch_error",
          ):
              if field not in required:
                  required.append(field)
          path.write_text(json.dumps(schema, indent=2) + "\n")

          tests = Path("toolchain/tests/test_local_storage_v19.py")
          text = tests.read_text()
          test = '''\n\ndef test_v2_schema_requires_exact_steer_boundary_fields() -> None:\n    schema_path = Path(__file__).parents[1] / "codex_wire_audit" / "proof_schema_templates" / "local-storage-semantics-v2.schema.json"\n    schema = json.loads(schema_path.read_text(encoding="utf-8"))\n    required = schema["properties"]["transitions"]["properties"]["revert"]["required"]\n    assert {\n        "steer_representation",\n        "steer_independent_branch_supported",\n        "tui_steer_branch_error",\n    } <= set(required)\n'''
          if "test_v2_schema_requires_exact_steer_boundary_fields" not in text:
              tests.write_text(text + test)
          PY
          git diff --check
      - name: Validate exact storage contract
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python -m pytest -q tests/test_local_storage_v19.py
          python -m pytest -q
          python tools/maintainability_metrics.py --write
          make legacy-assets
          make check-assets
          python tools/check_canonical_contract.py
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/source-capabilities.json"
      - name: Commit and push topic
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "Jacob"
          git config user.email "240170694+wignerStan@users.noreply.github.com"
          git commit -m "test(storage): require steer boundary contract"
          git push origin HEAD:refs/heads/contract/storage/fix/steer-boundary
