name: storage-contract-refresh

on:
  push:
    branches: [ci/storage-contract-refresh]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/storage-contract-refresh
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply storage contract update
        run: |
          set -euo pipefail
          cp .github/scripts/storage_refresh.py /tmp/storage_refresh.py
          git fetch origin main
          git checkout -B contract/storage/fix/restart-projection-semantics origin/main
          python /tmp/storage_refresh.py
      - name: Validate full source tree
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python -m pytest -q tests/test_local_storage_v19.py
          python -m pytest -q
          python tools/maintainability_metrics.py --write
          make check-assets
          python tools/check_canonical_contract.py
      - name: Commit exact topic
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "codex-contract-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): model restart projection authority"
          git push --force-with-lease origin HEAD:contract/storage/fix/restart-projection-semantics
