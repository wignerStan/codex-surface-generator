name: storage-contract-refresh

on:
  push:
    branches: [ci/storage-contract-refresh]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply storage contract update
        env:
          PATCH_SCRIPT_ZLIB_B64: ""
        run: |
          set -euo pipefail
          git checkout -b contract/storage/fix/restart-projection-semantics
          python - <<'PY'
          import base64, os, pathlib, zlib
          payload = base64.b64decode(os.environ["PATCH_SCRIPT_ZLIB_B64"])
          pathlib.Path("/tmp/storage_refresh.py").write_bytes(zlib.decompress(payload))
          PY
          python /tmp/storage_refresh.py
      - name: Validate full source tree
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python -m pytest -q tests/test_local_storage_v19.py
          python -m pytest -q
          python tools/maintainability_metrics.py --write
          make check-assets
          python tools/check_canonical_contract.py
      - name: Commit exact topic
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "codex-contract-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): model restart projection authority"
          git push origin HEAD:contract/storage/fix/restart-projection-semantics
