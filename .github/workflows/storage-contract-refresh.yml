name: storage-contract-refresh

on:
  push:
    branches: [ci/storage-contract-refresh]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply exact steer-boundary contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "976b952770b7d766418ed842288455543e64b76b"
          git checkout -b contract/storage/fix/steer-boundary
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {text.count(old)}")
              return text.replace(old, new, 1)

          specs = Path("toolchain/codex_wire_audit/extractors/local_storage_specs.py")
          text = specs.read_text()
          text = replace_once(
              text,
              '    "history_read": "source_spec.extra.local_storage_history_read",\n    "shell_snapshot":',
              '    "history_read": "source_spec.extra.local_storage_history_read",\n    "tui_backtrack": "source_spec.extra.local_storage_tui_backtrack",\n    "shell_snapshot":',
              "source id",
          )
          text = replace_once(
              text,
              '    "history_read": ("list_turns", "list_items", "thread_history_db"),\n    "shell_snapshot": (',
              '    "history_read": ("list_turns", "list_items", "thread_history_db"),\n    "tui_backtrack": (\n        "A turn can contain multiple user messages when it was steered.",\n        "app-server cannot fork in the middle of a turn.",\n        "the selected prompt is a steer and cannot be branched independently",\n    ),\n    "shell_snapshot": (',
              "markers",
          )
          specs.write_text(text)

          registry = Path("toolchain/codex_wire_audit/source_registry.py")
          lines = registry.read_text().splitlines()
          needle = 'source_spec.extra.local_storage_history_read'
          index = next(i for i, line in enumerate(lines) if needle in line and 'local_storage_specs' not in line)
          row = '        ("source_spec.extra.local_storage_tui_backtrack", "local_storage_tui_backtrack", "codex-rs/tui/src/app_backtrack.rs", ("backtrack_fork_before_turn_id", "cannot be branched independently", "cannot fork in the middle of a turn")),'
          if row not in lines:
              lines.insert(index + 1, row)
          registry.write_text("\n".join(lines) + "\n")

          lifecycle = Path("toolchain/codex_wire_audit/extractors/local_storage_lifecycle.py")
          text = lifecycle.read_text()
          text = replace_once(
              text,
              '            "supports_intra_turn_item_cutoff": False,',
              '            "supports_intra_turn_item_cutoff": False,\n            "steer_representation": "additional user message inside an existing turn",\n            "steer_independent_branch_supported": False,\n            "tui_steer_branch_error": "the selected prompt is a steer and cannot be branched independently",',
              "revert steer semantics",
          )
          text = replace_once(
              text,
              '        {\n            "id": "local_storage.sidecars_follow_thread_identity",',
              '        {\n            "id": "local_storage.steer_is_not_independent_branch_boundary",\n            "statement": "a steer is an additional user message within a turn and cannot be branched independently",\n        },\n        {\n            "id": "local_storage.sidecars_follow_thread_identity",',
              "steer invariant",
          )
          lifecycle.write_text(text)

          schema_path = Path("toolchain/codex_wire_audit/proof_schema_templates/local-storage-semantics-v2.schema.json")
          schema = json.loads(schema_path.read_text())
          revert = schema["properties"]["transitions"]["properties"]["revert"]
          revert["properties"]["steer_representation"] = {"const": "additional user message inside an existing turn"}
          revert["properties"]["steer_independent_branch_supported"] = {"const": False}
          revert["properties"]["tui_steer_branch_error"] = {"const": "the selected prompt is a steer and cannot be branched independently"}
          schema_path.write_text(json.dumps(schema, indent=2) + "\n")

          tests = Path("toolchain/tests/test_local_storage_v19.py")
          text = tests.read_text()
          anchor = "\ndef _snapshot(overrides: dict[str, str] | None=None) -> SourceSnapshot:"
          fixture = '''\nSOURCE_TEXTS["tui_backtrack"] = """\n    // A turn can contain multiple user messages when it was steered.\n    // app-server cannot fork in the middle of a turn.\n    bail!("the selected prompt is a steer and cannot be branched independently");\n"""\n'''
          if 'SOURCE_TEXTS["tui_backtrack"]' not in text:
              text = replace_once(text, anchor, fixture + anchor, "fixture insertion")
          text = replace_once(
              text,
              '    assert r["supports_intra_turn_item_cutoff"] is False',
              '    assert r["supports_intra_turn_item_cutoff"] is False\n    assert r["steer_representation"] == "additional user message inside an existing turn"\n    assert r["steer_independent_branch_supported"] is False\n    assert r["tui_steer_branch_error"] == "the selected prompt is a steer and cannot be branched independently"',
              "test assertions",
          )
          text += '''\n\ndef test_tui_steer_branch_boundary_drift_is_fail_visible() -> None:\n    broken = SOURCE_TEXTS["tui_backtrack"].replace(\n        "the selected prompt is a steer and cannot be branched independently",\n        "steer is now independently branchable",\n    )\n    result, diagnostics = _extract({"tui_backtrack": broken})\n    assert result.semantic_complete is False\n    assert "LOCAL_STORAGE_SEMANTIC_MARKER_MISSING" in {item.code for item in diagnostics.values()}\n'''
          tests.write_text(text)
          PY
          git diff --check
      - name: Validate exact storage contract
        working-directory: toolchain
        run: |
          set -euo pipefail
          python -m pip install --constraint ci/constraints.txt -e '.[test]'
          python -m pytest -q tests/test_local_storage_v19.py
          python -m pytest -q
          make legacy-assets
          python tools/maintainability_metrics.py --write
          make check-assets
          python tools/check_canonical_contract.py
          python -m codex_wire_audit.release_contract --output "$RUNNER_TEMP/source-capabilities.json"
      - name: Commit and push topic
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "Jacob"
          git config user.email "240170694+wignerStan@users.noreply.github.com"
          git commit -m "fix(storage): classify steer turn boundary"
          git push origin HEAD:refs/heads/contract/storage/fix/steer-boundary
