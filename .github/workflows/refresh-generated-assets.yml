name: refresh-generated-assets

on:
  push:
    paths:
      - ".github/workflows/refresh-generated-assets.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Regenerate deterministic assets
        working-directory: toolchain
        run: |
          make assets
          mkdir -p ci-out/generated
          cp -R codex_wire_audit_v11_schemas ci-out/generated/
          cp -R codex_wire_audit_v11_examples ci-out/generated/
          cp codex_wire_audit_v19_maintainability_metrics.json ci-out/generated/
          cp CODEX_WIRE_AUDIT_V19_METRICS.md ci-out/generated/
      - name: Upload regenerated assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regenerated-deterministic-assets
          path: toolchain/ci-out/generated
          if-no-files-found: error
          retention-days: 1
