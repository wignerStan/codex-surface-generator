name: refresh-generated-assets

on:
  push:
    paths:
      - ".github/workflows/refresh-generated-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolchain/ci/constraints.txt
      - name: Install constrained package and test dependencies
        working-directory: toolchain
        run: python -m pip install --constraint ci/constraints.txt -e '.[test]'
      - name: Regenerate affected deterministic assets
        working-directory: toolchain
        run: make legacy-assets metrics
      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            toolchain/codex_wire_audit_v11_examples/source-registry.default.json \
            toolchain/codex_wire_audit_v11_examples/manifest.json \
            toolchain/codex_wire_audit_v19_maintainability_metrics.json \
            toolchain/CODEX_WIRE_AUDIT_V19_METRICS.md
          if git diff --cached --quiet; then
            echo "Generated assets are already current."
          else
            git commit -m "Regenerate source registry and metrics assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
